ns.\n- Build modern web UIs using React, TypeScript, and modern frontend frameworks.\n- Develop scalable backend services and APIs using Python, Node.js, FastAPI, Express, or similar technologies.\n- Design and implement RESTful and GraphQL APIs.\n- Build and optimize large-scale data platforms leveraging SQL and NoSQL databases.\n- Develop automation workflows for engineering productivity, infrastructure management, analytics, and reporting.\n- Partner with infrastructure teams to deploy and operate applications in Kubernetes and containerized environments.\n- Build dashboards, reporting platforms, and data visualization tools.\n- Integrate AI/ML and LLM technologies into internal engineering workflows where applicable.\n- Drive software architecture discussions, technical design reviews, and best practices.\n- Mentor junior engineers and contribute to engineering excellence across the team.\n- Troubleshoot performance, scalability, reliability, and security issues in production environments.\n- Collaborate with cross-functional teams to translate business and engineering requirements into technical solutions.\n\n\nRequired Qualifications\n\n\n\n- Bachelor's, Master's, or PhD in Computer Science, Computer Engineering, or related field.\n- 8+ years of professional software development experience.\n- Strong experience building and deploying full stack web applications.\n- Expert-level programming skills in Python.\n- Strong experience with JavaScript/TypeScript and Node.js.\n- Experience developing modern front-end applications using React.\n- Experience building REST APIs and microservices.\n- Strong understanding of software design patterns, object-oriented programming, and distributed systems.\n- Experience with relational databases such as PostgreSQL, MySQL, or SQL Server.\n- Experience with NoSQL databases such as MongoDB.\n- Experience with Git-based development workflows.\n- Experience working in Linux environments.\n- Strong debugging, performance tuning, and formance, and availability.\n- Troubleshoot and resolve issues across application and cloud infrastructure layers.\n- Define and implement AWS architecture and development best practices.\n- Partner with architects and developers to create supportable designs and solve complex technical problems.\n- Support critical production incidents and drive timely issue resolution when escalation is not feasible.\n- Create and maintain system documentation, runbooks, procedures, and knowledge-sharing materials.\n- Monitor application and infrastructure health using logging and monitoring tools.\n- Stay informed on cloud computing technologies, business drivers, and emerging industry trends.\n\nResponsibilities\n\n\n\n- Proven experience as a MERN Stack Developer with AWS cloud expertise.\n- Strong proficiency in JavaScript, HTML, CSS, Bootstrap, React.js (Class and Functional Components), Node.js, Express.js, and MongoDB.\n- Hands-on experience with AWS services such as EC2, Kinesis, S3, Lambda, and API Gateway.\n- Strong knowledge of Git, Webpack, Babel, and modern front-end development toolchains.\n- Experience designing and implementing serverless and microservices-based architectures on AWS.\n- Hands-on experience with AWS deployment and infrastructure management tools, including AWS CLI and CloudFormation.\n- Familiarity with Jenkins, DevOps practices, and CI/CD pipeline implementation.\n- Ability to optimize applications for performance, scalability, reliability, and cost efficiency.\n- Strong analytical, troubleshooting, and problem-solving skills with attention to detail.\n- Good-to-have experience with AWS services such as DynamoDB, RDS, ECS, and Elasticsearch.\n\n7-Eleven Global Solution Center is an Equal Opportunity Employer committed to diversity in the workplace. Our strategy focuses on three core pillars – workplace culture, diverse talent and how we show up in the communities we serve. As the recognized leader in convenience, the 7-Eleven family of brands embra xico &amp; Latin America, Spain, Taiwan, UAE/Dubai, the U.K., and the U.S., with additional local license partners in over twenty additional markets across the globe. Lead brands include Vogue, The New Yorker, GQ, Architectural Digest, Condé Nast Traveler, Vanity Fair, Wired, Allure, Ars Technica, Bon Appétit, House &amp; Garden, Pitchfork, Tatler, and Vogue Business.\n\nJob Description\n\nLocation:\n\nBengaluru, KA\n\nAbout Platform Engineering\n\nOur mission is to build modern media platforms to serve our omnichannel experiences for our portfolio of global brands such as Vogue, Wired, Vanity Fair, and Glamour which currently reaches over 500 million, monthly users. We need your help to create new capabilities and strengthen our existing ones so that our brands can reach wider audiences through engaging digital experiences.\n\nQuality, performance, experimentation, and speed of delivery are all principles at the heart of what we do as a Platform Engineering group. We have strong capabilities in areas such as editorial tooling, content delivery, design systems, advertising, and commerce that we will continue to improve and grow. Our vision is to additionally invest in areas such as video, subscriptions, membership, and next-generation editorial tools.\n\nYou will be working alongside international colleagues across the US, London, and India. We strongly emphasize cross-functional working by partnering directly with Product, Data, Design, UX, and Delivery.\n\nAbout The Role\n\nCondé Nast is looking for an experienced engineer to join and help us build the next generation of our content creation digital products. You will work closely with our product teams and help lead engineering teams in their shared mission to scale out and build our internal platform. These teams’ focus spans many types of products essential to editors, other engineers, and subscribers. Your work will drive the future of Condé Nast’s digital strategy in today’s publishing market and reach millions of readers around the world.\n\nResponsibilities\n\n\n\n- Collaborate with other disciplines (engineering, design, product) in the creation and iteration of web applications built to enable our editors to produce the best content they can\n- Helping leading projects from ideation to execution to maintenance\n- Collaborating with the broader engineering group on new ideas or improving existing ones\n- Identify and improve code and usability performance issues\n- Participate in design and code reviews\n- Understand and champion AI Native way of working\n- Helping us grow and expand our engineering teams\n\nAbout You\n\n\n\n- Strong analytical and problem-solving skills\n- Expert-level fluency in at least 1 programming language - preferably Node\n- Experience working with, designing, and deploying production-grade React applications\n- Experience working with and helping large scale Design Systems\n- Familiarity and experience with designing, and deploying production-grade RESTful APIs, experience\n- Sound knowledge of GraphQL and Apollo Federation is a must.\n- Strong end-to-end testing experience and an emphasis on TDD methodologies\n- Eager to learn about new technologies and implement these ideas in a production environment\n\nOur Tech\n\n\n\n- Languages and Frameworks: JavaScript, Node, React\n- Data: Mongo, Postgres, Kafka, SQS\n- Deployment: Docker, AWS, Terraform, Kubernetes, GitHub Actions \n- Datadog, Splunk - for observing our platform\n- APIs: GraphQL, Apollo Federation, AWS AppSync\n- Source Control: Git, GitHub\n\nHow We Work\n\n\n\n- Pairing. We like knowledge sharing and upskilling\n- We work with engineers across time zones &amp; locations\n- Infrastructure as Code everywhere\n- AI Native way fo working\n- (Oncall - teams are responsible for their own apps)\n\nWhy Work With Us?\n\n\n\n- We offer industry-leading compensation and benefits\n- We are a bunch of smart, passionate, diverse co-workers who love to teach and love to learn\n- We provide what nents and backend services.\n-  Build reusable components, shared utilities, and scalable patterns to accelerate delivery. Backend &amp; API Development\n-  Develop RESTful APIs and backend modules in Node.js with clear contracts, validation, and error handling.\n-  Integrate backend services with frontend workflows, ensuring consistency, reliability, and performance.\n-  Implement authentication/authorization flows and secure data handling practices. Quality, Performance &amp; Collaboration\n-  Write unit/integration tests and participate in code reviews to maintain high engineering standards.\n-  Optimize frontend rendering and backend response times through profiling and performance tuning.\n-  Collaborate with designers, QA, and stakeholders to deliver polished releases and iterate based on feedback. AI-Enabled Enhancements\n-  Contribute to AI-assisted features such as intelligent recommendations, summarization, or workflow automation where applicable.\n-  Support integration of AI capabilities into the application while ensuring usability, safety, and measurable outcomes. About us: Infosys is a global leader in next-generation digital services and consulting. We enable clients in more than 50 countries to navigate their digital transformation. With over four decades of experience in managing the systems and workings of global enterprises, we expertly steer our clients through their digital journey. We do it by enabling the enterprise with an AI-powered core that helps prioritize the execution of change. We also empower the business with agile digital at scale to deliver unprecedented levels of performance and customer delight. Our always-on learning agenda drives their continuous improvement through building and transferring digital skills, expertise, and ideas from our innovation ecosystem. Infosys provides equal employment opportunities to applicants and employees without regard to race, color, sex, gender identity; sexual orientation, religious practices and observances; national origin; pregnancy, childbirth, or related medical conditions; status as a protected veteran or spouse/family member of a protected veteran; or disability.","postedAt":"2026-09-06","url":"https://in.linkedin.com/jobs/view/fullstack-react-js-%2B-node-js-developer-at-infosys-4444687936?position=18&pageNum=0&refId=Bu7O1dO3QJ2Zur1oxiCRWw%3D%3D&trackingId=vPYfMFll5paXPid%2FOxQ3Gg%3D%3D","companySizeRaw":374406,"fitScore":54,"tier":"stretch","matchedSkills":["react","node","typescript","javascript","java","restful","ai-powered","ai-assisted"],"missing":["3+ yrs required"]},{"source":"LinkedIn","title":"Senior Full Stack Developer - Node.js/React.js","company":"NetConnect  AS","location":"Bengaluru, Karnataka, India","description":"About The Role\n\nThis is not a role where you maintain a dashboard and close tickets. We build AI-native enterprise software. Real-time multilingual voice, heavy data pipelines, multi-tenant systems, and interfaces that thousands of people sit inside all day, across India, the UK and Europe.\n\nThe work is hard in the way good engineering work is hard. Latency budgets you actually have to hit. Queries that fall apart at scale unless you think about them properly. UI that has to stay responsive while streaming data in from three places at once.\n\nIf you like being handed a spec and told what to type, this will not suit you. If you like owning a hard problem end to end and being the person accountable for it, keep reading.\n\nWhat You'll Be Doing\n\nOn the backend:\n\n\n\n-  Design and own services in Node and TypeScript, sitting on PostgreSQL.\n-  Model data properly. Normalised where it matters, denormalised where it earns you something. You should be comfortable reasoning about foreign keys, partial and composite indexes, and what a covering index actually buys you.\n-  Read query plans. Kill N+1s. Understand connection pooling, transaction isolation levels, advisory locks, and why a long-running transaction on a hot table ruins everyone's afternoon.\n-  Build multi-tenant boundaries that hold. Tenant scoping, RBAC, row-level isolation, audit trails. Getting this wrong in enterprise software is not a bug, it is an incident.\n-  Work with event-driven flows. Queues, workers, retries with backoff, idempotency keys, dead letter handling, backpressure. Exactly-once is a lie, design for at-least-once and make it safe.\n-  Caching that is actually correct. Cache-aside patterns, TTL strategy, stampede protection, distributed locks, and knowing when invalidation is the wrong answer.\n-  Real-time paths. SSE and WebSockets, streaming responses, connection lifecycle, reconnection semantics.\n-  Integrate with enterprise systems designed in a different decade. Legacy file transfer, XML and SOAP-ish APIs, webhook contracts, OAuth flows, rate limits you do not control.\n\nOn The Frontend\n\n\n\n-  Build in React and TypeScript on a modern Next.js setup. Server components, client components, and a clear head about which does what and why.\n-  Streaming SSR, suspense boundaries, route-level code splitting, and hydration behaviour you can explain rather than guess at.\n-  Own Core Web Vitals. LCP, INP, CLS. Bundle analysis, dependency pruning, font and image strategy, no waterfalls in the data layer.\n-  Complex stateful UI. Server state in a proper query cache, client state kept minimal, optimistic updates, race condition handling, stale data reconciliation.\n-  Data-dense interfaces done well. Virtualised tables, infinite scroll, filter and sort state in the URL, forms with schema validation on both sides of the wire.\n-  Real-time UI that does not thrash. Streaming tokens, live status, presence, without re-rendering the world every tick.\n-  A design system that stays consistent. Typed component APIs, sensible primitives, accessibility that is not an afterthought.\n\nAcross Both\n\n\n\n-  Own features from schema to screen. You design the tables, write the API, build the UI, ship it, and watch what happens after.\n-  Review code seriously and push back when something is wrong.\n-  Argue about what to build, not just how.\n\nThe Kind Of Stack You'll Be In\n\n\n\n-  Languages: TypeScript end to end, SQL.\n-  Frontend: React, Next.js, a component library, utility CSS, schema validation.\n-  Backend: Node.js, a lightweight HTTP framework, a typed query layer, REST and streaming APIs.\n-  Data: PostgreSQL, Redis, object storage.\n-  Cloud: AWS across multiple regions. Serverless functions, managed queues, CDN, managed Postgres and cache.\n-  AI layer: LLM APIs, function calling, streaming inference, real-time voice.\n\nYou do not need every one of these on your CV. You do need to be the kind of engineer who picks up a new one over a weekend and is useful on Monday.\n\nWhat We're Looking For\n\n\n\n-  5 to 7 years building production web systems. Real users, real load, real consequences when it breaks.\n-  Deep TypeScript. Generics, discriminated unions, inference. You use the type system to prevent bugs, not to decorate the code.\n-  Strong React. You know why a component re-rendered and how to stop it. You know when memoisation helps and when it is cargo cult.\n-  Genuinely comfortable in a database. You can write the SQL yourself and you know what the ORM is doing when you don't.\n-  You have designed an API someone else had to consume and it held up.\n-  You have debugged something in production under pressure and written up what went wrong afterwards.\n-  You write code a stranger can read in six months.\n\nOn background: We lean towards engineers who have worked at a startup where they had to own a lot without a playbook, or who come from a strong engineering school (IIT, NIT, BITS, IIIT and similar). Both is ideal. Neither is a dealbreaker if the work speaks loudly enough. Send the GitHub, the side project, the thing that got used.\n\nNice To Have\n\n\n\n-  Worked with LLM APIs, streaming completions, prompt and eval design, or real-time voice.\n-  Built multi-tenant B2B SaaS with enterprise customers.\n-  Performance work you can talk about specifically. What was slow, what you measured, what you changed.\n-  Open source contributions, or a technical blog where you explain things properly.\n-  You have been the first or second engineer on something.\n\nWhat Working Here Is Like\n\n\n\n-  Fast. Really fast. Decisions get made in one conversation, not across weeks of meetings. There is no ticket queue you sit in. If you see something broken you fix it.\n-  You get the whole picture. Founders sit in the same room. You will know what we are prioritising and why.\n-  The flip side is ownership. Nobody chases you for status. Ship it, tell the team, move on.\n\nWhat You Get\n\n\n\n-  Competitive salary, benchmarked properly for senior engineers in Bengaluru.\n-  Real ownership of systems that carry weight, not a slice of someone else's feature.\n-  Hard problems, short feedback loops, and no layers between you and the outcome.\n-  A team where you will not be the smartest person in the room every day.\n\n(ref:hirist.tech)","postedAt":"2026-09-09","url":"https://in.linkedin.com/jobs/view/senior-full-stack-developer-node-js-react-js-at-netconnect-as-4464929429?position=17&pageNum=0&refId=Bu7O1dO3QJ2Zur1oxiCRWw%3D%3D&trackingId=zF8Z5lSe66UbV8My7tlfOA%3D%3D","companySizeRaw":127,"fitScore":53,"tier":"stretch","matchedSkills":["react","node","typescript","next.js","llm"],"missing":[]},{"source":"Naukri","title":"MERN Stack Developer","company":"Unknown company","location":"","description":"Bachelor of Engineering<br><br>Minimum Qualifications: 35 years of hands-on experience building web applications using the MERN stack.  . Strong proficiency in JavaScript / TypeScript,React,Node.js,and Express.js.  <br><br>Preferred Skills . Reactive Programming. NodeJS. Full stack. MERN stack<br><br>Digital Experience","postedAt":null,"url":"https://www.naukri.com/job-listings-mern-stack-developer-infosys-limited-bengaluru-3-to-5-years-070926918763","companySizeRaw":null,"fitScore":51,"tier":"stretch","matchedSkills":["react","node","express","typescript","javascript","java"],"missing":[]}]};
  const listEl = document.getElementById('list');
  function render(tier) {
    const jobs = tiers[tier] || [];
    listEl.innerHTML = jobs.length
      ? jobs.map(j => `
        <div class="card" data-tier="${j.tier}">
          <div class="card-top">
            <div>
              <p class="card-title">${j.title}</p>
              <p class="card-sub"><b>${j.company}</b> · ${j.location || "Location n/a"} · ${j.source}</p>
            </div>
            <div class="score"><div class="num">${j.fitScore}</div><div class="lbl">fit score</div></div>
          </div>
          <div class="tags">${(j.matchedSkills||[]).slice(0,6).map(t=>'<span class="tag">'+t+'</span>').join('')}${(j.missing||[]).map(t=>'<span class="tag miss">'+t+'</span>').join('')}</div>
          <div class="card-foot">
            <span class="posted">${j.postedAt ? new Date(j.postedAt).toLocaleDateString() : "Date n/a"}</span>
            <a class="apply" href="${j.url}" target="_blank" rel="noopener">View / Apply →</a>
          </div>
        </div>`).join('')
      : '<div class="empty">No roles in this tier right now.</div>';
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    render(t.dataset.tier);
  }));
  render('high');

  // Check-in streak, stored in this browser's localStorage (real page, not a sandboxed artifact)
  (function(){
    const today = new Date().toISOString().slice(0,10);
    const raw = localStorage.getItem('jobradar_streak');
    let state = raw ? JSON.parse(raw) : { streak: 0, last: null };
    if (state.last !== today) {
      const gapDays = state.last ? Math.round((new Date(today) - new Date(state.last)) / 86400000) : null;
      state.streak = gapDays === 1 ? state.streak + 1 : 1;
      state.last = today;
      localStorage.setItem('jobradar_streak', JSON.stringify(state));
    }
    document.getElementById('streakbar').innerHTML =
      '🔥 ' + state.streak + '-day check-in streak · Last refreshed by the daily job: ' + new Date("2026-09-09T07:33:41.347Z").toLocaleString();
  })();
</script>
