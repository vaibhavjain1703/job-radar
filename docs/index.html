bute to code reviews, knowledge sharing, and technical documentation.\n- Mentor and provide technical guidance to junior software engineers.\n- Participate in training and knowledge-sharing initiatives.\n- Develop a strong understanding of the company's platform, products, and processes.\n- Identify opportunities for technical and process improvements and contribute to their implementation.\nJob Requirements:\nMust Have:\n\n- 3–5 years of professional software development experience.\n- Strong hands-on experience with the MERN stack:MongoDBMongooseExpress.jsReact.jsNode.js\n- Strong experience with TypeScript.\n- Mandatory hands-on experience with NestJS.\n- Mandatory hands-on experience with GraphQL, including API development and integration.\n- Good understanding and practical application of SOLID principles and object-oriented design concepts.\n- Experience writing effective unit and integration tests.\n- Experience developing and consuming RESTful APIs.\n- Basic understanding of microservices architecture.\n- Knowledge of both NoSQL and SQL databases.\n- Experience with cloud-based application development and deployment.\n- Exposure to Docker and containerization.\n- Understanding of CI/CD pipelines and deployment practices.\n- Basic awareness of event-driven architecture and Kafka.\n- Experience with Git and GitHub.\n- Familiarity with JIRA or similar project-management tools.\n- Good communication and collaboration skills.\n- Ability to actively participate in technical discussions and contribute to team decisions.\n- Positive attitude, willingness to learn, and self-motivated approach.\nGood to Have\n\n- Experience with Microsoft Azure.\n- Experience with Serverless architecture.\n- Experience with Terraform / Infrastructure as Code.\n- Stronger expertise in MongoDB and database performance optimization.\n- Experience with Node.js ecosystem and build/development tools such as:BabelWebpackJestESLintHelm\n- Experience with GraphQL tools/frameworks such as Apoll   const listEl = document.getElementById('list');

      ? jobs.map(j => `
        <div class="card" data-tier="${j.tier}">
          <div class="card-top">
            <div>
              <p class="card-title">${j.title}</p>
              <p class="card-sub"><b>${j.company}</b> · ${j.location || "Location n/a"} · ${j.source}</p>
            </div>
            <div class="score"><div class="num">${j.fitScore}</div><div class="lbl">fit score</div></div>
          </div>
          <div class="tags">${(j.matchedSkills||[]).slice(0,6).map(t=>'<span class="tag">'+t+'</span>').join('')}${(j.missing||[]).map(t=>'<span class="tag miss">'+t+'</span>').join('')}</div>
          <div class="card-foot">
            <span class="posted">${j.postedAt ? new Date(j.postedAt).toLocaleDateString() : "Date n/a"}</span>
            <a class="apply" href="${j.url}" target="_blank" rel="noopener">View / Apply →</a>
          </div>
        </div>`).join('')
      : '<div class="empty">No roles in this tier right now.</div>';
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    render(t.dataset.tier);
  }));
  render('high');

  // Check-in streak, stored in this browser's localStorage (real page, not a sandboxed artifact)
  (function(){
    const today = new Date().toISOString().slice(0,10);
    const raw = localStorage.getItem('jobradar_streak');
    let state = raw ? JSON.parse(raw) : { streak: 0, last: null };
    if (state.last !== today) {
      const gapDays = state.last ? Math.round((new Date(today) - new Date(state.last)) / 86400000) : null;
      state.streak = gapDays === 1 ? state.streak + 1 : 1;
      state.last = today;
      localStorage.setItem('jobradar_streak', JSON.stringify(state));
    }
    document.getElementById('streakbar').innerHTML =
      '🔥 ' + state.streak + '-day check-in streak · Last refreshed by the daily job: ' + new Date("2026-10-09T09:28:30.226Z").toLocaleString();
  })();
