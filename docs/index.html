ication skills and ability to work in a cross-functional team.\n\n\nGood to Have\n\n- \nExperience with AI/LLM integrations.\n- \nExperience working with AI agents or agentic workflows.\n- \nExperience with real-time systems or event-driven architectures.\n- \nExposure to voice technologies, streaming, speech-to-text, or text-to-speech.\n- \nExperience with Redis or other caching technologies.\n- \nExperience with microservices architecture.\n- \nExperience with Docker and Kubernetes.\n- \nExperience with AWS, Azure, or GCP.\n- \nExperience with CI/CD pipelines.\n- \nExperience working in a SaaS or B2B product company.\n- \nExposure to AI coding assistants and AI-powered development workflows.\n\n\nWhat We Value\nAt Enterprise Bot, we value ownership over titles.\nWe're looking for someone who:\n\n- \nDoesn't wait for instructions for every step.\n- \nCan take a problem and figure out how to solve it.\n- \nIs comfortable working in a fast-changing startup environment.\n- \nCares about the quality of what they build.\n- \nIs curious about AI and new technologies.\n- \nEnjoys learning and experimenting.\n- \nCan balance speed with good engineering practices.\n- \nIs comfortable working across different parts of the technology stack.\n\n\nBenefits\n\n- \nBuild products at the forefront of GenAI and Conversational AI.\n- \nWork on real-world AI products used by international enterprises.\n- \nGet exposure to LLMs, AI agents, automation, voice, and real-time systems.\n- \nWork with a global engineering and product team.\n- \nHigh ownership and the opportunity to make a visible impact.\n- \nFlat hierarchy and an open, collaborative culture.\n- \nOpportunity to learn and work with rapidly evolving AI technologies.\n- \nCompetitive compensation and strong opportunities for growth.\n\n\nJoin our team\nIf you're excited about building full-stack products and want to work where software engineering meets AI, we'd love to hear from you.\n","postedAt":"2026-10-14","url":"https:/ uld be discriminated against because of their differences, such as age, disability, ethnicity, gender, gender identity and expression, religion, or sexual orientation.\n\nAll employment decisions shall be made without regard to age, race, creed, colour, religion, sex, national origin, ancestry, disability status, veteran status, sexual orientation, gender identity or expression, genetic information, marital status, citizenship status or any other basis as protected by federal, state, or local law.\n\nUST reserves the right to periodically redefine your roles and responsibilities based on the requirements of the organization and/or your performance.\n\n\n\n-  To support and promote the values of UST.\n-  Comply with all Company policies and procedures\n\nSkills\n\n\n\n- net fullstack,c#,.net,asp.net core, AI Tool","postedAt":"2026-10-18","url":"https://in.linkedin.com/jobs/view/developer-iii-software-engineering-net-fullstack-at-ust-4411586387?position=7&pageNum=0&refId=O6b56SECBvYSjcRnronKnQ%3D%3D&trackingId=wYHTVF6vRqLcZ3%2FR27VP6Q%3D%3D","companySizeRaw":41032,"fitScore":54,"tier":"stretch","matchedSkills":["react","express","javascript","java","restful"],"missing":[]},{"source":"LinkedIn","title":"Forward Deployed Engineer (FDE)","company":"Appscrip","location":"Bengaluru, Karnataka, India","description":"About The Role\n\nWe are hiring a Forward Deployed Engineer (FDE) who takes a client's problem from the first conversation to a working product in production. You will build both the front end and the back end, use AI tools as a daily part of how you work, and own the outcome rather than a ticket queue.\n\nYou will also speak with our client directly: demos, status updates, scoping, and respectful pushback when a request will not serve their goal. You will work as part of a team, on site in our Bangalore office.\n\nAs a Forward Deployed Engineer, you stay close to the client's problem and outcome using an AI Native approach.\n\nWhat You Will Own\n\nYou own the outcome from discovery to post-launch, not a single layer of the stack.\n\n\n\n-  Discover and scope: turn a vague client need into a clear problem statement, a success metric, and a small first release.\n-  Design and build: deliver the user interface, APIs, and database for features end to end, choosing the simplest approach that works.\n-  Ship and run: set up deployment (CI/CD, cloud basics), add monitoring, and fix production issues you or your team introduced.\n-  Communicate with clients: run demos and status calls, write clear async updates, give honest estimates, and flag risks early.\n-  Iterate on results: review usage and feedback after launch, and decide what to improve, cut, or leave alone.\n-  Work with the team: review code, share what works with AI tools, and help teammates unblock their own work.\n-  Protect quality and trust: write tests, review AI-generated code critically, and handle client data and secrets responsibly.\n\nWhat \"AI-native\" means here \n\nAI-native means AI tools are part of how you plan, build, and check your work, and you stay accountable for every line that ships. Familiarity with a tool name is not enough.\n\n\n\n-  You work with coding agents daily (for example Claude Code, Cursor, or Copilot) and can explain how you steer them: specs, context files, task breakdown, and when you take the keyboard back.\n-  You review AI output critically. You test it, read it for security and maintainability problems, and reject what does not hold up.\n-  You verify, not just generate. Tests, logging, and checks come with your work, because speed without confidence is not delivery.\n-  You know when not to use AI, and you can explain that choice to a client in plain language.What we are looking for Experience level matters less than how you work. We value agile, quick learners who can show real shipped work.\n\nTechnical baseline \n\n\n\n-  Language-agnostic engineering: you pick up new languages and frameworks quickly and choose the right tool for the problem, rather than defending a favorite stack.\n-  Real strength in a few languages or frameworks (for example JavaScript or TypeScript, Python, Java, Go, or C#), shown in projects that span both the front end and back end.\n-  Fundamentals that carry across stacks: web basics (HTML, CSS, HTTP), designing and consuming APIs, and data modeling with SQL databases.\n-  Git, pull requests, and basic CI/CD and cloud deployment.\n-  A track record of using AI tools in real projects.\n\nHow You Work\n\n\n\n-  Communication: clear spoken and written English, comfortable on client calls, and able to explain technical trade-offs to non-technical people.\n-  Ownership: you follow a problem through to resolution and raise issues before they become surprises.\n-  Outcome focus: you measure your work by what changed for the user or the client, not by lines of code or tasks closed.\n-  Product thinking: you ask who the user is, what problem we are solving, and how we will know it worked. You suggest simpler options and say what you would leave out.\n-  Problem solving: you break down unclear problems, form hypotheses, and debug methodically instead of guessing.\n-  Agility: you are comfortable with changing requirements, short cycles, and learning new tools quickly.\n\nNice to have \n\n\n\n-  Prior client-facing, consulting, or agency experience, especially with North American clients.\n-  Docker, a major cloud provider (AWS, Azure, or GCP), and infrastructure basics.\n-  Experience with testing frameworks, observability tools, and performance tuning.\n-  Awareness of secure coding, privacy expectations, and common client compliance requirements\n\nsuch as SOC 2.\n\n\n\n-  Open-source contributions, technical writing, or a deployed side project you can demo.\n\nHow We Evaluate\n\nWe look at what you have built, not only how you interview. Please be ready to share your Git repositories and any deployed work.\n\n\n\n-  Application and Git review: send a link to your repositories (GitHub, GitLab, or similar) with a short note on the project you are proudest of. We read your commit history, pull requests, tests, and README, and try the deployed demo if there is one.2. Project walkthrough: a conversation where you explain one project in depth: the problem, your\n\nkey decisions, what broke, what you would change, and how you used AI along the way.\n\n\n\n-  Practical exercise with AI tools allowed: a short build task where we watch how you plan, direct your tools, and verify the result.\n-  Client communication round: a mock client call where you present your work, answer questions, and handle a change in scope.\n-  Team and values conversation: how you collaborate, take feedback, and own mistakes.\n\nIf your best work is under NDA, tell us. You can describe it in the walkthrough and show a side project in the repository review instead.\n\nRole details \n\nTitle : Forward Deployed Engineer (FDE)\n\nEmployment type : Full-time employee\n\nLocation : On site, Bangalore office (not at client sites)\n\nExperience level : Open: we hire for agility and proven work, not\n\nyears\n\nTeam :Part of a project team, working alongside a\n\nproduct or account lead\n\nClient contact : Shared: you and the lead both speak with North\n\nAmerican clients\n\nDomain : Generalist, across industries\n\nWorking-hours overlap with North America and compensation range are still to be confirmed before this is published.\n\nIf any candidates interested for above role, pls drop message on this WhatsApp number\n\nnine three one six one two zero one three two\n\nSkills:- Fullstack Developer, HTML/CSS, HTTP, TypeScript, Python, Java, C#, front end , Backend and AI native","postedAt":"2026-10-13","url":"https://in.linkedin.com/jobs/view/forward-deployed-engineer-fde-at-appscrip-4476455524?position=17&pageNum=0&refId=omE6bqAjA3iUObB%2BWytBdg%3D%3D&trackingId=Zj%2Fnjh%2BoRrr3Wp6LZ%2B1ZTQ%3D%3D","companySizeRaw":173,"fitScore":53,"tier":"stretch","matchedSkills":["typescript","javascript","java","docker","ci/cd","claude"],"missing":[]},{"source":"LinkedIn","title":"Intermediate Professional, Digital Solutions","company":"WSP in India","location":"Bengaluru, Karnataka, India","description":"Job Description\n\nWSP is seeking an AI Engineer to develop and support production-oriented Generative AI solutions for the Middle East AI portfolio from the Bengaluru GCC. The role will work across AI products, agents, automation workflows and enterprise integrations, with emphasis on secure engineering, measurable quality and responsible AI.\n\nResponsibilities\n\n\n\n-  Develop GenAI applications, agents and automation workflows using approved designs and engineering standards. \n-  Implement retrieval-augmented generation, function calling, structured outputs and prompt patterns to improve solution reliability and usability. \n-  Integrate AI components with enterprise systems, APIs, approved vector search services and governed data sources. \n-  Build and maintain ingestion, chunking, embedding, indexing and retrieval pipelines for structured and unstructured content. \n-  Create evaluation datasets and execute repeatable testing for accuracy, grounding, safety, latency and solution quality. \n-  Apply responsible AI controls including validation, guardrails, content filtering, traceability and human oversight. \n-  Develop clean, reusable and well-documented Python components and participate in code reviews. \n-  Support deployment, monitoring, incident resolution and continuous optimisation of AI solutions. \n\n\nQualifications\n\n\n\n-  Bachelor’s degree in Computer Science, Engineering, Data Science or a related discipline.\n-  0–3 years of relevant software, data or AI engineering experience, including internships or strong project experience.\n-  Working knowledge of Python, REST APIs, SQL and software engineering fundamentals.\n-  Practical understanding of LLMs, embeddings, RAG, prompt engineering and evaluation methods.\n-  Expo ommunicate clearly, document decisions and support transparent delivery reporting across distributed teams.\n\n\nBGV:\n\n\n\n-  Employment with WSP India is subject to the successful completion of a background verification (“BGV”) check conducted by a third-party agency appointed by WSP India.\n-  Candidates are advised to ensure that all information provided during the recruitment process — including documents uploaded — is accurate and complete, both to WSP India and its BGV partner”.\n\n\nAbout Us\n\nWSP is one of the world's leading professional services consulting firms. We are dedicated to our local communities and propelled by international brainpower. We are technical experts and strategic advisors including engineers, technicians, scientists, architects, planners, surveyors and environmental specialists, as well as other design, program and construction management professionals. We design lasting solutions in the Transportation &amp; Infrastructure, Property &amp; Buildings, Earth &amp; Environment, Power &amp; Energy, Resources and Industry sectors, as well as offering strategic advisory services. Our talented people around the globe engineer projects that will help societies grow for lifetimes to come.\n\nWith approximately 4,000 talented people across 3 locations (Noida, Bengaluru &amp; Mumbai offices) in India and more than 73,000 globally, in 550 offices across 40 countries, we engineer projects that will help societies grow for lifetimes to come.\n\nAt “WSP” we draw on the diverse skills and capabilities of our employees globally to compete for the most exciting and complex projects across the world and bring the same level of expertise to our local communities. We are proud to be an international collective of innovative thinkers who work on the most complex problems. Uniﬁed under one strong brand, we use our local expertise, international reach and global scale to prepare our cities and environments for the future, connect communities and help societies thrive in built and natural ecosystems. True to our guiding principles, our business is built on four cornerstones: Our People, Our Clients, Our Operational Excellence and Our Expertise.\n\n www.wsp.com \n\nWe are\n\n\n\n- Passionate people doing purposeful and sustainable work that helps shape our communities and the future.\n- A collaborative team that thrives on challenges and unconventional thinking.\n- A network of experts channeling our curiosity into creating solutions for complex issues.\n\n\nInspired by diversity, driven by inclusion, we work with passion and purpose.\n\nWorking with Us\n\nAt WSP, you can access our global scale, contribute to landmark projects and connect with the brightest minds in your field to do the best work of your life. You can embrace your curiosity in a culture that celebrates new ideas and diverse perspectives. You can experience a world of opportunity and the chance to shape a career as unique as you.\n\nOur Hybrid Working Module\n\nWith us, you can operate in a flexible, agile, yet structured work environment and follow a Hybrid Work Model.\n\n\n\n- Maximize collaboration.\n- Maintain product quality and cultural integrity.\n- Balance community, collaboration, opportunity, productivity, and efficiency.\n\n\nHealth, Safety and Wellbeing\n\nOur people are our greatest asset, and we prioritize a safe work environment. Health, safety, and wellbeing are integral to our culture, with each of us accountable for fostering a safe workplace through our “Making Health and Safety Personal” initiative. Our Zero Harm Vision drives us to reduce risks through innovative solutions, earning recognition for our global health and safety practices with the prestigious RoSPA Health and Safety Awards for six consecutive years.\n\nInclusivity and Diversity\n\nWSP India is dedicated to fostering a sustainable and inclusive work environment where our greatest strength - Our People -feel valued, respected, and supported. We ensure an unbiased approa
