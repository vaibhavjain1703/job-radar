ional excellence.\n\n\nWe are excited to announce an opening for Software Engineer I, AI Engineering (AIDLC) at ACI. Please find below the details of the role and its responsibilities. \nPosition Title: Software Engineer I, AI Engineering (AIDLC) \nRoles &amp; responsibilities: \n\n- Build and test parts of agents for the AIDLC (AI-driven development lifecycle) pod, guided by senior engineers. \n- Contribute to agents for stages of the software development lifecycle: requirements and design, code review before merge, security-finding remediation, test generation, release and path to production, and SRE and incident support. \n- Implement tool/function calling and use MCP servers, including code knowledge graphs exposed over MCP, in the agents you work on. \n- Implement RAG pipelines and basic memory and state handling for your agents. \n- Write evals for the parts you build: a small golden dataset, simple LLM-as-judge checks and regression tests. Run them before each change. \n- Add tracing and logging to your agents, and use traces to debug failures. \n- Follow the pod's guardrails, including prompt-injection defenses and human-in-the-loop approval points. \n- Write production code every week. Use agentic coding tools daily (e.g. Claude Code, GitHub Copilot, Cursor) and check every change they produce before you commit it. \n- Take part in code and agent reviews, and learn from the feedback. \n- Report how your agents perform against the baseline the pod sets, and learn to watch token cost. \n- Work with senior engineers and partner teams to meet security and compliance standards. \n\n\nExperience Required: \n\n- AI experience is a MUST. You have built an LLM agent or RAG application end to end, with at least one eval. An AI internship, coursework or a personal project counts. Describe it in your application or link a repo or demo. \n- 1-3 years of software engineering experience. Recent graduates with a strong AI project or internship are welcome to apply. There i               <p class="card-sub"><b>${j.company}</b> · ${j.location || "Location n/a"} · ${j.source}</p>
            </div>
            <div class="score"><div class="num">${j.fitScore}</div><div class="lbl">fit score</div></div>
          </div>
          <div class="tags">${(j.matchedSkills||[]).slice(0,6).map(t=>'<span class="tag">'+t+'</span>').join('')}${(j.missing||[]).map(t=>'<span class="tag miss">'+t+'</span>').join('')}</div>
          <div class="card-foot">
            <span class="posted">${j.postedAt ? new Date(j.postedAt).toLocaleDateString() : "Date n/a"}</span>
            <a class="apply" href="${j.url}" target="_blank" rel="noopener">View / Apply →</a>
          </div>
        </div>`).join('')
      : '<div class="empty">No roles in this tier right now.</div>';
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    render(t.dataset.tier);
  }));
  render('high');

  // Check-in streak, stored in this browser's localStorage (real page, not a sandboxed artifact)
  (function(){
    const today = new Date().toISOString().slice(0,10);
    const raw = localStorage.getItem('jobradar_streak');
    let state = raw ? JSON.parse(raw) : { streak: 0, last: null };
    if (state.last !== today) {
      const gapDays = state.last ? Math.round((new Date(today) - new Date(state.last)) / 86400000) : null;
      state.streak = gapDays === 1 ? state.streak + 1 : 1;
      state.last = today;
      localStorage.setItem('jobradar_streak', JSON.stringify(state));
    }
    document.getElementById('streakbar').innerHTML =
      '🔥 ' + state.streak + '-day check-in streak · Last refreshed by the daily job: ' + new Date("2026-11-20T10:21:15.523Z").toLocaleString();
  })();
</script>
</body>
</html>
