node","express","mongodb","mysql","typescript","ci/cd","nosql"],"missing":[]},{"source":"LinkedIn","title":"Developer Associate (SAP Concur Travel Engineering AI & Core team)","company":"SAP","location":"Bengaluru, Karnataka, India","description":"Job Description\n\nWhat you'll bring\n\nYou have foundational programming skills in Go Lang / C# /Java, Python, JavaScript and a genuine curiosity about how AI-native applications work. A basic understanding of APIs, microservices architecture, CI/CD practices, and cloud fundamentals is expected.\n\nAwareness of AI/LLM concepts, including prompt engineering, AI-assisted development, and basic evaluation techniques, is a plus. Familiarity with testing, debugging, logging, and structured development workflows will help you contribute from the start.\n\n1 to 3 years of relevant experience in software development with master’s or bachelor’s degree in computer science, engineering or equivalent.\n\nWhat You'll Build\n\nYou'll contribute to AI-enabled application features in SAP Concur Travel through coding, testing, and debugging. LLM integration tasks, prompt testing, and AI output validation are part of the regular work. You'll help prepare evaluation datasets and participate in benchmarking workflows. System logs, metrics, and application behavior are things you'll monitor to spot issues and support observability improvements. CI/CD pipelines, deployment support, and basic automation workflows are areas where you'll contribute, along with maintaining clear documentation.\n\nWhere you belong\n\nYou will join the SAP Concur Travel Engineering AI &amp; Core team in Labs India. SAP Concur offers cloud-based services that make it simple to manage travel and expenses. SAP Concur supports more than 54,000 businesses and 96 million users across 150+ countries, processing over one billion transactions annually.\n\nYou'll work in a collaborative, global engineering environment with access to mentorship and structured learning. Knowledge sharing and honest technical feedback are part of how this team operates. You'll gain hands-on exposure to AI-first systems and modern development practices, not just observe them. If you're early in your career and want to build real technical depth in AI-native application engineering, this is a good fit.\n\nSkills\n\nWe value the skills you bring and support you to build on them through our learning and development opportunities. These are the skills associated with this role:\n\nCore Skills-Foundational skills in Golang/C#, cloud basics (AWS/GCP/Azure), RDBMS, (SQL Server or MySql etc)REST APIs, and awareness of AI/ML and data pipeline concepts.\n\nAI Adoption Capability, AI output quality assurance, AI-assisted development, context engineering, agentic orchestration, agentic engineering, application security, cloud architecture, observability, semantic retrieval, high availability engineering, troubleshooting, evaluations and benchmarking engineering, CI/CD.\n\nEqual Employment Opportunity (EEO) Statement\n\nOur company does not discriminate in employment on the basis of race, color, religion, sex (including pregnancy and gender identity), national origin, political affiliation, sexual orientation, marital status, disability, genetic information, age, membership in an employee organization, retaliation, parental status, military service, or other non-merit factor.\n\nAdditional Information\n\nAbout SAP\n\nWith a global network of customers, partners, employees, and thought leaders, SAP helps the world run better and improves people’s lives.\n\nAs a leader in enterprise applications and business AI, SAP stands at the nexus of business and technology. For over 50 years, organizations have trusted SAP to bring out their best by uniting business-critical operations spanning finance, procurement, HR, supply chain, and customer experience.\n\nWe win with inclusion\n\nSAP’s culture of inclusion, focus on health and well-being, and flexible working models help ensure that everyone, regardless of background, feels included and can run at their best. At SAP, we believe we are made stronger by the unique capabilities and qualities that each person brings to our company, and we invest in our employees to inspire confidence and help everyone realize their full potential. We ultimately believe in unleashing all talent and creating a better world.\n\nSAP is committed to the values of Equal Employment Opportunity and provides accessibility accommodations to applicants with physical and/or mental disabilities. If you are interested in applying for employment with SAP and are in need of accommodation or special assistance to navigate our website or complete your application, please send an email with your request to the Recruiting Operations Team: Careers@sap.com.\n\nFor SAP employees: Only permanent roles are eligible for the SAP Employee Referral Program, according to the eligibility rules set in the SAP Referral Policy. Specific conditions may apply for roles in Vocational Training.\n\nQualified applicants will receive consideration for employment without regard to age, race, religion, national origin, ethnicity, gender (including pregnancy and childbirth), sexual orientation, gender identity or expression, protected veteran status, or disability, in compliance with applicable federal, state, and local legal requirements.\n\nSuccessful candidates might be required to undergo a background verification with an external vendor.\n\nAI Usage in the Recruitment Process\n\nFor information on the responsible use of AI in our recruitment process, please refer to our Guidelines for Ethical Usage of AI in the Recruiting Process.\n\nPlease note that any violation of these guidelines may result in disqualification from the hiring process.\n\nCompany Description\n\nYou'll join a supportive international team that values continuous learning and inclusive collaboration. With coaching from experienced developers and access to global resources, you'll grow your craft and contribute to products used worldwide.","postedAt":"2026-11-18","url":"https://in.linkedin.com/jobs/view/developer-associate-sap-concur-travel-engineering-ai-core-team-at-sap-4490878636?position=10&pageNum=0&refId=XvXQZ4ZAPZptuosr96FP0Q%3D%3D&trackingId=tNqUnmfUqWJojfee7y6UWA%3D%3D","companySizeRaw":148308,"fitScore":73,"tier":"medium","matchedSkills":["express","mysql","javascript","java","rest api","ci/cd","llm","ai-assisted"],"missing":[]}],"stretch":[{"source":"LinkedIn","title":"R&D Specialist - Full Stack","company":"Nokia","location":"Bengaluru, Karnataka, India","description":"Job Description\n\nAs a R&amp;D Specialist – Full Stack (Marketplace), you will design, develop, and operate cloud‑hosted e‑commerce applications using Node.js, React.js, and modern micro front‑end architectures. You will build performant APIs and user interfaces, manage data persistence using MySQL and NoSQL stores, and leverage Redis and Memcached for high‑throughput, low‑latency experiences across web and mobile channels. You will collaborate closely with product, architecture, and SRE/DevOps teams to ensure secure, scalable, and observable platforms, from local development through CI/CD pipelines to production environments.\n\nHow You Will Contribute And What You Will Learn\n\n\n\n- Design, develop, and maintain back‑end services and RESTful APIs using Node.js, integrating with relational (MySQL) and NoSQL databases for core e‑commerce capabilities such as catalog, cart, checkout, and payments.\n- Build rich, responsive front‑end experiences in React.js, implementing modular micro front‑end architectures and Webpack‑based build configurations for multiple storefronts and white‑label solutions.\n- Implement and optimize in‑memory caching layers using Redis and Memcached to improve page load times, session handling, and throughput under high traffic.\n- Work with DevOps and platform engineers to containerize services, integrate with CI/CD pipelines, and ensure reliable deployments, monitoring, logging, and alerting across environments.\n- Troubleshoot and resolve production issues across the stack, perform performance tuning and capacity planning, and drive continuous improvements in code quality, test coverage, and developer productivity.\n\nKey Skills And Experience\n\nMust have:\n\n\n\n- 8 to 10 years of software development experience\n- Experience in full‑stack development with Node.js and React.js, building and maintaining production e‑commerce or high‑traffic web applications.\n- Knowledge of micro front‑end architecture patterns, module federation, and Webpack configuration for bundling, optimization, and code splitting.\n- Practical experience with relational and NoSQL databases (MySQL plus at least one NoSQL store), including schema design, query optimization, and data modeling for e‑commerce domains.\n\nIt would be good if you had:\n\n\n\n- Expertise with Redis and Memcached (or similar in‑memory caches) for session storage, caching strategies, and performance optimization of web applications.\n- Proficiency with Git‑based workflows and experience working in Agile teams, including code reviews, automated testing, and CI/CD practices.\n\nAbout Us\n\nAdvancing connectivity to secure a brighter world.\n\nNokia is a global leader in connectivity for the AI era. With expertise across fixed, mobile and transport networks, powered by the innovation of Nokia Bell Labs, we’re advancing connectivity to secure a brighter world.\n\nLearn more about life at Nokia .\n\nOur recruitment process\n\nWe act inclusively and respect the uniqueness of people. Our employment decisions are made regardless of race, color, national or ethnic origin, religion, gender, sexual orientation, gender identity or expression, age, marital status, disability, protected veteran status or other characteristics protected by law. We are committed to a culture of inclusion built upon our core value of respect.\n\nIf you’re interested in this role but do \n- Integrate with frontend applications, third-party APIs, and databases.\n\n\nCode Quality &amp; Testing\n\n\n\n- Write unit and integration tests; treat testing as part of “done.”\n- Participate actively in code reviews — both giving and receiving feedback.\n- Follow team conventions for readability, error handling, and documentation.\n\n\nArchitecture &amp; Technical Direction\n\n\n\n- Contribute to design discussions and propose approaches for your features.\n- Make sound implementation-level decisions; escalate larger architectural calls.\n\n\nCollaboration &amp; Influence\n\n\n\n- Collaborate with Product, Architects, and Frontend to scope and deliver work.\n- Communicate progress, blockers, and trade-offs clearly.\n\n\nOperations, Reliability &amp; Security\n\n\n\n- Monitor and troubleshoot the services you own; fix bugs and address performance issues.\n- Follow secure-coding practices and handle data responsibly — including PHI — across backend systems.\n\n\nCore Technical Skills:\n\nThe capabilities we expect you to bring to the role, grouped by area.\n\nLanguages &amp; Foundations\n\n\n\n- Solid proficiency in Golang and its ecosystem.\n- Working understanding of concurrency, goroutines, and channels.\n- Strong problem-solving, debugging, and analytical skills, with the ability to deliver scoped projects independently.\n- Working knowledge of Python is a big plus.\n\n\nAI-Assisted Development\n\n\n\n- Uses AI coding tools effectively but treats generated code as a draft — reviews it, runs and tests it locally to confirm correctness, and catches security and performance issues before raising a PR.\n\n\nAPIs &amp; Architecture\n\n\n\n- Experience building RESTful APIs (gRPC a plus).\n- Hands-on experience developing within a microservices architecture.\n\n\nData Stores\n\n\n\n- Core: a relational database — PostgreSQL and/or MySQL.\n- Nice to have: exposure to DynamoDB (NoSQL) and/or Redis (caching) — these are a plus, not a requirement.\n\n\nCloud &amp; Infrastructure\n\n\n\n- Comfortable working in a cloud environment (we run on AWS), with Docker, CI/CD pipelines, and Git.\n- Our backend runs on AWS Elastic Beanstalk and Lambda; specific experience with these services isn’t required — if you know Docker or any container-orchestration tooling, you’ll get up to speed quickly.\n- As our platform scales, we’re expanding into container orchestration (ECS/EKS, Kubernetes), so container experience is a strong plus.\n\n\nBonus Points:\n\n\n\n- Experience in healthcare, fintech, or analytics-driven platforms.\n- Familiarity with event tracking, system monitoring, and payment workflows.\n- Understanding of compliance, data privacy, or healthcare regulations (e.g., HIPAA/PHI).\n\n\nHow to apply for this opportunity?\n\n\n\n- Step 1: Click On Apply! And Register or Login on our portal.\n- Step 2: Complete the Screening Form &amp; Upload updated Resume\n- Step 3: Increase your chances to get shortlisted &amp; meet the client for the Interview!\n\n\nAbout Uplers:\n\nOur goal is to make hiring reliable, simple, and fast. Our role will be to help all our talents find and apply for relevant contractual onsite opportunities and progress in their career. We will support any grievances or challenges you may face during the engagement.\n\n(Note: There are many more opportunities apart from this on the portal. Depending on the assessments you clear, you can apply for them as well).\n\nSo, if you are ready for a new challenge, a great work environment, and an opportunity to take your career to the next level, don't hesitate to apply today. We are waiting for you!","postedAt":"2026-11-20","url":"https://in.linkedin.com/jobs/view/software-engineer-ii-golang-at-uplers-4492925170?position=5&pageNum=0&refId=huLZ6ZsPYRVVYgo2e6dENw%3D%3D&trackingId=BGj8ekPeiVPaVl93akY2tQ%3D%3D","companySizeRaw":1104,"fitScore":53,"tier":"stretch","matchedSkills":["mysql","rest api","restful","docker","ci/cd","nosql","ai-assisted"],"missing":[]},{"source":"LinkedIn","title":"Full Stack Software Engineer - Postgres","company":"ClickHouse","location":"Bengaluru, Karnataka, India","description":"About ClickHouse\n\nRecognized on the 2025 Forbes Cloud 100 list, ClickHouse is one of the most innovative and fast-growing private cloud companies. With over 2,000 customers and ARR that has more than quadrupled over the past year, ClickHouse leads the market in real-time analytics, data warehousing, observability, and AI workloads. We're on a mission to transform how companies use data. Come be a part of our journey!\n\nAbout The Team\n\nThe Managed Postgres team is building ClickHouse's fully managed Postgres service. It gives developers a fast, reliable Postgres that works natively alongside ClickHouse, so one platform covers both transactional and real-time analytical workloads. This is a strategic, high-visibility initiative, and the user experience we build will shape how thousands of developers create, manage, monitor, and scale their databases.\n\nAbout The Role\n\nWe're looking for a Full Stack Software Engineer to help build responsive, performant, and elegant interfaces that make complex database operations feel simple. You'll work closely with product, design, and backend engineers, and you'll learn from senior engineers while owning real features from day one.\n\nWhat You'll Do\n\n\n\n- Turn designs and user requirements into intuitive, high-quality interfaces for the Managed Postgres experience in ClickHouse Cloud.\n- Build features end-to-end: React and TypeScript on the frontend, plus integration with (and contributions to) backend APIs.\n- Build data-rich UIs for metrics, diagnostics, backups, replication, and performance insights.\n- Contribute to click-ui, our open-source design system, and follow frontend best practices: code quality, performance, accessibility, and testing.\n- Give product and design feedback from a developer's point of view.\n\nAbout You\n\n\n\n- Experience: 1–4 years in frontend or full-stack development.\n- Core skills: Solid React, TypeScript, and modern frontend fundamentals (state management, component architecture, data fetching).\n- Backend exposure: Comfortable working with REST APIs; Node.js, Go, or similar is a plus.\n- Collaboration: You enjoy working closely with designers and backend engineers across a global team.\n- Developer empathy: You care about fast, clear, purposeful UIs for technical users.\n- Ownership: You take initiative, ask good questions, and carry work from idea to delivery.\n- Growth mindset: You're keen to learn and grow your scope quickly.\n\nNice to Have\n\n\n\n- Experience with Postgres, SQL, or database tooling\n- Accessibility (WCAG) knowledge\n- Data visualization or dashboard experience\n- Open-source contributions\n\nWhy Join Us\n\n\n\n- Shape the future of the Postgres user experience inside one of the fastest-growing data platforms.\n- Real ownership and autonomy from day one.\n- Learn from experts in databases, distributed systems, and developer experience.\n- Solve meaningful problems in performance, scale, and usability.\n\nPerks\n\n\n\n- Flexible work environment - ClickHouse is a globally distributed company and remote-friendly. We currently operate in over 25 countries.\n- Healthcare - Employer contributions towards your healthcare.\n- Equity in the company - Every new eligible team member who joins our company receives equity.\n- Time off - Flexible time off in the US, generous entitlement in other countries.\n- A USD$500 Home office setup if you’re a remote employee.\n- Global Gatherings – We believe in the power of in-person connection and offer opportunities to engage with colleagues at company-wide offsites.\n\nCulture - We All Shape It\n\nAs part of a rapidly scaling start-up, you will be instrumental in shaping our culture.\n\nAre you interested in finding out more about our culture? Learn more about our values here. Check out our blog posts or follow us on LinkedIn to find out more about what’s happenin pportunity. As the only enterprise-grade storage service natively embedded in Google Cloud, AWS, and Microsoft Azure, we empower customers to run everything from traditional workloads to enterprise AI with unmatched performance, resilience, and security.\n\nOur culture\n\nWe celebrate mold breakers, bold thinkers, and problem solvers. We reward initiative, impact, and ownership. We provide flexibility so you can balance professional ambition with your personal life. Here, differences are not just welcomed—they drive everything we do.\n\nIf you're ready to innovate, rise to the challenge, and own every moment - make your next move your best one. Apply now.\n\nSubmitting an Application\n\nTo ensure a streamlined and fair hiring process for all candidates, our team only reviews applications submitted through our company website. This practice allows us to track, assess, and respond to applicants efficiently. Emailing our employees, recruiters, or Human Resources personnel directly will not influence your application.\n\nAI Disclosure\n\nFor select roles, some stages of our hiring process may use artificial intelligence tools to help evaluate applications and candidate selection. These tools support—rather than replace—human decision-making.","postedAt":"2026-11-18","url":"https://in.linkedin.com/jobs/view/senior-software-engineer-full-stack-developer-at-netapp-4481895981?position=12&pageNum=0&refId=HeYML4LwBctZmgs0xsUwHw%3D%3D&trackingId=9jeoGBr%2BULvzgdqNiQTjig%3D%3D","companySizeRaw":12701,"fitScore":50,"tier":"stretch","matchedSkills":["react","node","restful","ci/cd","llm"],"missing":[]}]};
  const listEl = document.getElementById('list');

    const jobs = tiers[tier] || [];
    listEl.innerHTML = jobs.length
      ? jobs.map(j => `
        <div class="card" data-tier="${j.tier}">
          <div class="card-top">
            <div>
              <p class="card-title">${j.title}</p>
              <p class="card-sub"><b>${j.company}</b> · ${j.location || "Location n/a"} · ${j.source}</p>
            </div>
            <div class="score"><div class="num">${j.fitScore}</div><div class="lbl">fit score</div></div>
          </div>
          <div class="tags">${(j.matchedSkills||[]).slice(0,6).map(t=>'<span class="tag">'+t+'</span>').join('')}${(j.missing||[]).map(t=>'<span class="tag miss">'+t+'</span>').join('')}</div>
          <div class="card-foot">
            <span class="posted">${j.postedAt ? new Date(j.postedAt).toLocaleDateString() : "Date n/a"}</span>
            <a class="apply" href="${j.url}" target="_blank" rel="noopener">View / Apply →</a>
          </div>
        </div>`).join('')
      : '<div class="empty">No roles in this tier right now.</div>';
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    render(t.dataset.tier);
  }));
  render('high');

  // Check-in streak, stored in this browser's localStorage (real page, not a sandboxed artifact)
  (function(){
    const today = new Date().toISOString().slice(0,10);
    const raw = localStorage.getItem('jobradar_streak');
    let state = raw ? JSON.parse(raw) : { streak: 0, last: null };
    if (state.last !== today) {
      const gapDays = state.last ? Math.round((new Date(today) - new Date(state.last)) / 86400000) : null;
      state.streak = gapDays === 1 ? state.streak + 1 : 1;
      state.last = today;
      localStorage.setItem('jobradar_streak', JSON.stringify(state));
    }
    document.getElementById('streakbar').innerHTML =
      '🔥 ' + state.streak + '-day check-in streak · Last refreshed by the daily job: ' + new Date("2026-11-24T12:50:38.971Z").toLocaleString();
  })();
