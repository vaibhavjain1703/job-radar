s and enables local financially literate freelancers across these small towns to source business through online and offline channels, recommend the right financial product(s) to customers as well as provide after sales support.These freelancers, who are located in more than 5000+ towns and cities, earn as much as INR 30,000 a month from WeRize in commissions.\n\n\nOur social distribution platform supported by financially literatefreelancers means exceptionally low cost of customer acquisition (CAC) and operations costs compared to both fully digital and on-the-ground financial services providers. Digital conversions among this target group are way lower when comparedto upper income customers in metros and hence pure digital CAC doesn’t workfor this segment. While companies like LIC and Fino Bank also rely on freelancer distribution, they deploy local on-fieldteams/branches to manage freelancers in every city. That resultsin very high CAC and operations costs for such companies. WeRize on the other hand, has been able to acquire, train and manage thousandsof freelancers in 5000+ citiesonly through its tech platform and without any feet-on-street team of its own. This results in highly profitable business model for Werize.\n\n\nTo know more about the company, please visit: https://www.werize.com\n\n\nRole Overview\nWe are looking for a Senior Full-Stack Engineer to design, build, and scale high-performance Web and Backend systems. In this role, you will lead end-to-end feature development and drive the integration of AI/LLM capabilities into our core financial products to automate workflows, personalize user experiences, and enhance decision-making systems.\n\n\nKey Responsibilities\n\n- Full-Stack Architecture: Design, build, and maintain scalable web applications, REST/gRPC APIs, and microservices.\n- AI &amp; Automation Integration: Embed AI models, LLMs, and intelligent automation into existing production pipelines and user interfaces.\n- Performance &amp; Reliabi   const listEl = document.getElementById('list');
  function render(tier) {
    const jobs = tiers[tier] || [];
    listEl.innerHTML = jobs.length
      ? jobs.map(j => `
        <div class="card" data-tier="${j.tier}">
          <div class="card-top">
            <div>
              <p class="card-title">${j.title}</p>
              <p class="card-sub"><b>${j.company}</b> · ${j.location || "Location n/a"} · ${j.source}</p>
            </div>
            <div class="score"><div class="num">${j.fitScore}</div><div class="lbl">fit score</div></div>
          </div>
          <div class="tags">${(j.matchedSkills||[]).slice(0,6).map(t=>'<span class="tag">'+t+'</span>').join('')}${(j.missing||[]).map(t=>'<span class="tag miss">'+t+'</span>').join('')}</div>
          <div class="card-foot">
            <span class="posted">${j.postedAt ? new Date(j.postedAt).toLocaleDateString() : "Date n/a"}</span>
            <a class="apply" href="${j.url}" target="_blank" rel="noopener">View / Apply →</a>
          </div>
        </div>`).join('')
      : '<div class="empty">No roles in this tier right now.</div>';
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    render(t.dataset.tier);
  }));
  render('high');

  // Check-in streak, stored in this browser's localStorage (real page, not a sandboxed artifact)
  (function(){
    const today = new Date().toISOString().slice(0,10);
    const raw = localStorage.getItem('jobradar_streak');
    let state = raw ? JSON.parse(raw) : { streak: 0, last: null };
    if (state.last !== today) {
      const gapDays = state.last ? Math.round((new Date(today) - new Date(state.last)) / 86400000) : null;
      state.streak = gapDays === 1 ? state.streak + 1 : 1;
      state.last = today;
      localStorage.setItem('jobradar_streak', JSON.stringify(state));
    }
    document.getElementById('streakbar').innerHTML =
      '🔥 ' + state.streak + '-day check-in streak · Last refreshed by the daily job: ' + new Date("2026-09-19T07:32:00.551Z").toLocaleString();
  })();
