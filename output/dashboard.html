buted systems with a track record of evaluating trade-offs (consistency, availability, latency, cost) and driving technical alignment across teams.\n- Experience with AI-assisted development practices and tools to increase engineering productivity (e.g., GitHub Copilot, Cursor, Claude Code, or equivalent).\n- Experience building or integrating LLM-powered features, agentic workflows, or AI-driven automation in production systems is a plus.\n- Strong ownership mentality with ability to drive work end-to-end in a collaborative environment.\n- Exposure to GraphQL and experience in building Federated GraphQL APIs is highly desirable.\n- Experience on contributing to open-source is a plus.\n\n\nBenefits are an essential part of your total compensation for the work you do every day. Whether you’re single, in a growing family, or nearing retirement, eBay offers a variety of comprehensive and competitive benefit programs to meet your needs. Including maternal &amp; paternal leave, paid sabbatical, and plans to help ensure your financial security today and in the years ahead because we know feeling financially secure during your working years and through retirement is important.\n\nHere at eBay, we love creating opportunities for others by connecting people from widely diverse backgrounds, perspectives, and geographies. So, being diverse and inclusive isn’t just something we strive for, it is who we are, and part of what we do each and every single day. We want to ensure that as an employee, you feel eBay is a place where, no matter who you are, you feel safe, included, and that you have the opportunity to bring your unique self to work. To learn about eBay’s Diversity &amp; Inclusion click here: https://www.ebayinc.com/our-company/diversity-inclusion/\n\nWe will ensure that individuals with disabilities are provided reasonable accommodation to participate in the job application or interview process, to perform essential job functions, and to receive other benefits and privi es, and event-driven solutions to support business and data processing requirements.\n- Translate business requirements into technical designs and implementation plans.\n- Build reusable components, application frameworks, and shared services to improve development efficiency.\n- Analysis and Planning\n\n- Analyze business and technical requirements and assess system impacts, dependencies, and risks.\n- Provide effort estimates, technical recommendations, and implementation strategies for new initiatives and enhancements.\n- Collaborate with solution architects, product owners, and stakeholders to define scalable solutions.\n- Application Support and Reliability\n\n- Support production applications and troubleshoot complex issues across UI, middleware, messaging platforms, and databases.\n- Monitor application performance and identify opportunities for optimization and automation.\n- Participate in on-call rotations and incident management activities.\n- Quality and Continuous Improvement\n\n- Develop automated units, integration, and regression tests.\n- Drive continuous improvement initiatives related to application performance, security, reliability, and maintainability.\n- Contribute to Agile ceremonies, sprint planning, retrospectives, and release activities.\n- Contribute towards Application Deployment, Disaster Recovery &amp; High Availability, Documentation, and Knowledge Sharing\n- Work with global technology teams across different time zones (primarily US) to deliver timely business value.\nSkills and Qualification (Functional and Technical Skills)\n\nFunctional Skills\n\n\n\n- Team Player: Support peers, team, and department management.\n- Communication: Excellent verbal, written, and interpersonal communication skills.\n- Problem Solving: Excellent problem-solving skills, incident management, root cause analysis, and proactive solutions to improve quality.\n- Partnership and Collaboration: Develop and maintain partnership with business and IT stakeholders\n- Attention to Detail: Ensure accuracy and thoroughness in all tasks.\n\nTechnical/Business Skills\n\n\n\n- Strong experience building web applications using React.js and JavaScript/TypeScript.\n- Strong experience developing backend services using Java, Spring Boot, and microservices architecture.\n- Experience implementing event-driven architecture using Kafka.\n- Experience using Python for automation, data processing, or backend services.\n- Advanced SQL development and database design experience with Oracle and Netezza.\n- Experience designing and consuming REST APIs.\n- Experience with GitLab, CI/CD pipelines, Jira, and Confluence.\n- Experience working in Agile/Scrum environments.\n- Excellent ability to communicate technical information clearly and work effectively with cross-functional teams\n- Strong analytical and problem-solving skills\n- Experience with cloud platforms (AWS) and container technologies such as Docker and Kubernetes is preferred.\n- Experience within financial services, banking, risk, treasury, forecasting, or regulatory reporting environments is highly desirable.\n\nRelationships &amp; Collaboration\n\n\n\n- Reports to: Senior Manager - Data Engineering\n- Partners: Senior leaders and cross-functional teams\n- Leads: A team of Data Engineering associates\n\nAccessibility Needs\n\nWe are committed to providing an inclusive and accessible hiring process. If you require accommodations at any stage (e.g. application, interviews, onboarding) please let us know, and we will work with you to ensure a seamless experience.\n\nEqual Employment Opportunity\n\nFC Global Services India LLP (First Citizens India) is an Equal Employment Opportunity Employer. We are committed to fostering an inclusive and accessible environment and prohibit all forms of discrimination on the basis of gender, religion, caste, disability, sexual orientation, economic status or any other characteristics protected by the law. We strive to foster a safe and respectful environment in which all individuals are treated with respect and dignity. Our EEO policy ensures fairness throughout the employee life cycle.","postedAt":"2026-10-01","url":"https://in.linkedin.com/jobs/view/software-engineer-ii-java-full-stack-at-first-citizens-india-4474372351?position=20&pageNum=0&refId=cwRDLUreSGbLftbQz1%2FLlQ%3D%3D&trackingId=VV63vUIcUzwqkHLdbfkY9A%3D%3D","companySizeRaw":1024,"fitScore":75,"tier":"medium","matchedSkills":["react","node","typescript","javascript","java","rest api","restful","docker","ci/cd"],"missing":[]},{"source":"LinkedIn","title":"IN_Senior Associate_MERN Developer_GCC_Advisory_Bangalore","company":"PwC India","location":"Bengaluru, Karnataka, India","description":"\nLine of Service\nAdvisory\n\n\nIndustry/Sector\nNot Applicable\n\n\nSpecialism\nOperations\n\n\nManagement Level\nSenior Associate\n\n\nJob Description &amp; Summary\nAt PwC, our people in business application consulting specialise in consulting services for a variety of business applications, helping clients optimise operational efficiency. These individuals analyse client needs, implement software solutions, and provide training and support for seamless integration and utilisation of business applications, enabling clients to achieve their strategic objectives.\n\nAs a business application consulting generalist at PwC, you will provide consulting services for a wide range of business applications. You will leverage a broad understanding of various software solutions to assist clients in optimising operational efficiency through analysis, implementation, training, and support.\n\n\n*Why PWC\n\nAt PwC, you will be part of a vibrant community of solvers that leads with trust and creates distinctive outcomes for our clients and communities. This purpose-led and values-driven work, powered by technology in an environment that drives innovation, will enable you to make a tangible impact in the real world. We reward your contributions, support your wellbeing, and offe   const listEl = document.getElementById('list');
  function render(tier) {
    const jobs = tiers[tier] || [];
    listEl.innerHTML = jobs.length
      ? jobs.map(j => `
        <div class="card" data-tier="${j.tier}">
          <div class="card-top">
            <div>
              <p class="card-title">${j.title}</p>
              <p class="card-sub"><b>${j.company}</b> · ${j.location || "Location n/a"} · ${j.source}</p>
            </div>
            <div class="score"><div class="num">${j.fitScore}</div><div class="lbl">fit score</div></div>
          </div>
          <div class="tags">${(j.matchedSkills||[]).slice(0,6).map(t=>'<span class="tag">'+t+'</span>').join('')}${(j.missing||[]).map(t=>'<span class="tag miss">'+t+'</span>').join('')}</div>
          <div class="card-foot">
            <span class="posted">${j.postedAt ? new Date(j.postedAt).toLocaleDateString() : "Date n/a"}</span>
            <a class="apply" href="${j.url}" target="_blank" rel="noopener">View / Apply →</a>
          </div>
        </div>`).join('')
      : '<div class="empty">No roles in this tier right now.</div>';
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    render(t.dataset.tier);
  }));
  render('high');

  // Check-in streak, stored in this browser's localStorage (real page, not a sandboxed artifact)
  (function(){
    const today = new Date().toISOString().slice(0,10);
    const raw = localStorage.getItem('jobradar_streak');
    let state = raw ? JSON.parse(raw) : { streak: 0, last: null };
    if (state.last !== today) {
      const gapDays = state.last ? Math.round((new Date(today) - new Date(state.last)) / 86400000) : null;
      state.streak = gapDays === 1 ? state.streak + 1 : 1;
      state.last = today;
      localStorage.setItem('jobradar_streak', JSON.stringify(state));
    }
    document.getElementById('streakbar').innerHTML =
      '🔥 ' + state.streak + '-day check-in streak · Last refreshed by the daily job: ' + new Date("2026-10-03T08:28:47.565Z").toLocaleString();
  })();
