ating and distributing every type of media today, spanning print and digital publishing in all formats. With a portfolio of some of today's most influential brands, the company continues to grow its audience through a global operational and content infrastructure across its 12 owned and operated markets. Headquartered in New York City, the company's owned and operated markets include China, France, Germany, India, Italy, Japan, Mexico &amp; Latin America, Spain, Taiwan, UAE/Dubai, the U.K., and the U.S., with additional local license partners in over twenty additional markets across the globe. Lead brands include Vogue, The New Yorker, GQ, Architectural Digest, Condé Nast Traveler, Vanity Fair, Wired, Allure, Ars Technica, Bon Appétit, House &amp; Garden, Pitchfork, Tatler, and Vogue Business.\n\nJob Description\n\nLocation:\n\nBengaluru, KA\n\nAbout Platform Engineering\n\nOur mission is to build modern media platforms to serve our omnichannel experiences for our portfolio of global brands such as Vogue, Wired, Vanity Fair, and Glamour which currently reaches over 500 million, monthly users. We need your help to create new capabilities and strengthen our existing ones so that our brands can reach wider audiences through engaging digital experiences.\n\nQuality, performance, experimentation, and speed of delivery are all principles at the heart of what we do as a Platform Engineering group. We have strong capabilities in areas such as editorial tooling, content delivery, design systems, advertising, and commerce that we will continue to improve and grow. Our vision is to additionally invest in areas such as video, subscriptions, membership, and next-generation editorial tools.\n\nYou will be working alongside international colleagues across the US, London, and India. We strongly emphasize cross-functional working by partnering directly with Product, Data, Design, UX, and Delivery.\n\nAbout The Role\n\nCondé Nast is looking for an experienced engineer to join and help us build the next generation of our content creation digital products. You will work closely with our product teams and help lead engineering teams in their shared mission to scale out and build our internal platform. These teams’ focus spans many types of products essential to editors, other engineers, and subscribers. Your work will drive the future of Condé Nast’s digital strategy in today’s publishing market and reach millions of readers around the world.\n\nResponsibilities\n\n\n\n- Collaborate with other disciplines (engineering, design, product) in the creation and iteration of web applications built to enable our editors to produce the best content they can\n- Helping leading projects from ideation to execution to maintenance\n- Collaborating with the broader engineering group on new ideas or improving existing ones\n- Identify and improve code and usability performance issues\n- Participate in design and code reviews\n- Understand and champion AI Native way of working\n- Helping us grow and expand our engineering teams\n\nAbout You\n\n\n\n- Strong analytical and problem-solving skills\n- Expert-level fluency in at least 1 programming language - preferably Node\n- Experience working with, designing, and deploying production-grade React applications\n- Experience working with and helping large scale Design Systems\n- Familiarity and experience with designing, and deploying production-grade RESTful APIs, experience\n- Sound knowledge of GraphQL and Apollo Federation is a must.\n- Strong end-to-end testing experience and an emphasis on TDD methodologies\n- Eager to learn about new technologies and implement these ideas in a production environment\n\nOur Tech\n\n\n\n- Languages and Frameworks: JavaScript, Node, React\n- Data: Mongo, Postgres, Kafka, SQS\n- Deployment: Docker, AWS, Terraform, Kubernetes, GitHub Actions \n- Datadog, Splunk - for observing our platform\n- APIs: GraphQL, Apollo Federation, AWS AppSync\n- Source Control: Git, GitHub\n\nHow We Work\n\n\n\n- Pairing. We like knowledge sharing and upskilling\n- We work with engineers across time zones &amp; locations\n- Infrastructure as Code everywhere\n- AI Native way fo working\n- (Oncall - teams are responsible for their own apps)\n\nWhy Work With Us?\n\n\n\n- We offer industry-leading compensation and benefits\n- We are a bunch of smart, passionate, diverse co-workers who love to teach and love to learn\n- We provide whatever hardware and software you need to be productive\n- A functional, well-disciplined product development organization\n- Big changes are happening in publishing and at Condé Nast, and this is a great time to be a part of it all!\n\nWhat happens next?\n\nIf you are interested in this opportunity, please apply below, and we will review your application as soon as possible. You can update your resume or upload a cover letter at any time by accessing your candidate profile.\n\nCondé Nast is an equal opportunity employer. We evaluate qualified applicants without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, disability, veteran status, age, familial status and other legally protected characteristics.","postedAt":"2026-09-07","url":"https://in.linkedin.com/jobs/view/software-engineer-iii-at-cond%C3%A9-nast-4454239342?position=15&pageNum=0&refId=GZTwRUJWAOSRSX0Tb4EaYQ%3D%3D&trackingId=UJE26%2BN9qUVtbbkcU4%2B4Yg%3D%3D","companySizeRaw":7088,"fitScore":60,"tier":"stretch","matchedSkills":["react","node","javascript","java","restful","docker","github actions"],"missing":[]},{"source":"LinkedIn","title":"Associate Software Engineer - AI","company":"Alegeus","location":"Bengaluru East, Karnataka, India","description":"Do you want to shape the future of fintech and healthtech? Energized by challenges and inspired by bold goals? Ready to elevate your career alongside driven and talented colleagues? If that sounds like you, explore a career at Alegeus today. Opportunity Happens Here.\n\nAssociate Software Engineer – AI\n\nJoin our team at Alegeus, where you’ll experience unmatched opportunity and a culture that cares deeply about succeeding together. As an Associate Software Engineer – AI, you’ll drive our technology vision forward and push the boundaries of innovation with cutting-edge solutions. This is your opportunity to work with groundbreaking technology and tackle complex challenges, shaping of future of our tech landscape. If you are passionate about innovation and eager to make a difference, we would love to have you as a part of our dynamic and forward-thinking team.\n\nOPPORTUNITY HAPPENS HERE — REALIZE YOURS\n\nAlongside The Best And The Brightest, You Will Regularly\n\n\n\n- Collaborate with team members to analyze business requirements and design documents, contributing to the successful coding and delivery of assigned modules.\n- Independently develop, test, and deliver high-quality code while adhering to industry best practices and quality standards.\n- Participate in agile development processes, ensuring timely and efficient delivery of software enhancements.\n- Ensure robust unit testing and quality assurance throughout the development cycle.\n- Provide support to fellow team members, offering guidance and assistance as needed to foster a collaborative work environment.\n\n\nEssential Skills For Creating a Lasting Impact\n\nAlegeus colleagues are known as problem-solvers, risk-takers, and innovative thinkers. As an Associate Software Engineer – AI, these skills are essential for success:\n\n\n\n- Abilities: Able to apply Object-Oriented Programming (OOP) concepts AI and ML, work with .NET fundamentals and C#, and utilize data structures and collection libraries for efficient, maintainable code.\n- Experience: Proficient in .NET Core, .NET Framework, C#, ASP.NET, SQL Server, and client-side scripting (JavaScript, JQuery). Familiar with Regex, Lambda expressions, Exceptions, NUnit, Git, and continuous integration. Preferably 0-1 years of experience in web development with Microsoft technologies, including design patterns, REST, HTTP, and T-SQL. Knowledge of asynchronous calls, multithreading, and Agile processes is a plus.\n- Education: Bachelor's degree or equivalent studies.\n- Location: Bangalore.\n- Shift: 12pm to 9pm IST\n\n\nBecause We Care, We Offer\n\n\n\n- A flexible work environment \n- Competitive salaries, paid vacation, and holidays \n- Robust professional development programs \n- Comprehensive health, wellness, and financial packages \n\n\nSHARED AMBITION. INSPIRED FUTURE.\n\nAt Alegeus, our success is guided by our aligned vision and values—it is how we work together and collaborate to achieve our goals.\n\n\n\n- People First. We pride ourselves in bringing talented people together and treating one another with care. \n- Partner Powered. We are committed to empowering our partners, knowing our success is shared and we win as one. \n- Always Advancing. We are driven by potential and relentlessly determined to achieve our goals. \n\n\n“I truly believe that people who are well-skilled and talented can go wherever they want in this company. We want to create the best place anyone has ever worked.” - Alegeus employee\n\nApply now, connect a friend to this opportunity, or sign up for job alerts!\n\nWe are committed to a policy of Equal Employment Opportunity and will not discriminate against an applicant or employee on the basis of race, color, religion, creed, national origin or ancestry, sex, age, physical or mental disability, veteran or military status, genetic information, sexual orientation, marital status, or any other legally recognized protected basis under federal, state or local laws, regulations or ordinances. The information collected by this application is solely to determine suitability for employment, verify identity and maintain employment statistics on applicants. \n\nAt Alegeus, being transparent about our compensation philosophy and approach is more than just a legal requirement. As our organization continues to grow and evolve, we have made a commitment to ensure that our compensation framework is equitable, data-driven, consistent, and unbiased, with allowable pay differences based on factors unique to each candidate (think: skills, experience, qualifications, etc.) in order to attract and retain a highly talented and committed workforce.\n\nWe are taking an “inside-out” approach to pay transparency by first educating our valued managers and internal workforce and then moving to publishing compensation ranges externally. In the interim, if you are a California, Colorado, Connecticut, Maryland, Nevada, New Jersey, New York, Ohio or Washington resident and this role is physically available in your state or classified as remote, you may be eligible to receive additional information about the compensation and benefits for this role, which we will provide upon request. Please send an email identifying the title of the role you are interested in and the state you reside in to talentacquisitionteam@alegeus.com.\n\nAlegeus may use AI technology during candidate interviews. The uses include recording, note-taking, and summarizing candidate interviews. The information generated by the AI technology will be used by Alegeus during the hiring process. If you wish to opt out of having AI technology transcribe your interview, please notify your recruiter in advance of the interview. Otherwise, by agreeing to an interview with us, you consent to the use of AI technology during your interview.","postedAt":"2026-09-12","url":"https://in.linkedin.com/jobs/view/associate-software-engineer-ai-at-alegeus-4466478934?position=3&pageNum=0&refId=yLp5%2F3Y0%2FbTeoPMDbVcw5w%3D%3D&trackingId=p1M54ZC6TtQ7cA9Mw1WIiA%3D%3D","companySizeRaw":789,"fitScore":60,"tier":"stretch","matchedSkills":["express","javascript","java","data structures"],"missing":[]},{"source":"LinkedIn","title":"Full Stack Developer (Django + DRF + Angular)","company":"Yokogawa","location":"Bengaluru, Karnataka, India","description":"Not just a job, but a career\n\nYokogawa, award winner for ‘Best Asset Monitoring Technology’ and ‘Best Digital Twin Technology’ at the HP Awards, is a leading provider of industrial automation, test and measurement, information systems and industrial services in several industries.\n\nOur aim is to shape a better future for our planet through supporting the energy transition, (bio)technology, artificial intelligence, industrial cybersecurity, etc. We are committed to the United Nations sustainable development goals by utilizing our ability to measure and connect.\n\nAbout The Team\n\nOur 18,000 employees work in over 60 countries with one corporate mission, to \"co-innovate tomorrow\". We are looking for dynamic colleagues who share our passion for technology and care for our planet. In return, we offer you great career opportunities to grow yourself in a truly global culture where respect, value creation, collaboration, integrity, and gratitude are highly valued and exhibited in everything we do.\n\nWeb Technologies: Angular, JavaScript, TypeScript, Web APIs, JSON, HTML, JavaScript (ES6+), HTML5, CSS3 &amp; UI/UX interactions, Bootstrap\n\nFramework: Django\n\nTools: Git (Version Control)\n\nIDE: Microsoft Visual Studio Code\n\nDatabase: PostgreSQL, MySQL &amp; SQL Server(optional)\n\nYokogawa is an Equal Opportunity Employer. Yokogawa wants a diverse, equitable and inclusive culture. We will actively recruit, develop, and promote people from a variety of backgrounds who differ in terms of experience, knowledge, thinking styles, perspective, cultural background, and socioeconomic status. We will not discriminate based on race, skin color, age, sex, gender identity and expression, sexual orientation, religion, belief, political opinion, nationality, ethnicity, place of origin, disability, family relations or any other circumstances. Yokogawa values differences and enables everyone to belong, contribute, succeed, and demonstrate their full potential.\n\nAre you being referred to one of our roles? If so, ask your connection at Yokogawa\n\nabout our Employee Referral process!","postedAt":"2026-09-06","url":"https://in.linkedin.com/jobs/view/full-stack-developer-django-%2B-drf-%2B-angular-at-yokogawa-4461082220?position=4&pageNum=0&refId=N2LuctobqEKyAocpvhqoJg%3D%3D&trackingId=KK%2F1T4CdN4FXt96f9HQWnA%3D%3D","companySizeRaw":8765,"fitScore":57,"tier":"stretch","matchedSkills":["express","mysql","typescript","javascript","java"],"missing":[]},{"source":"LinkedIn","title":"Java full stack, React Developer","company":"Infosys","location":"Bengaluru East, Karnataka, India","description":"Technology-&gt;Devops-&gt;Ansible,Technology-&gt;Java-&gt;Apache-&gt;Kafka,Technology-&gt;Java-&gt;Java - ALL,Technology-&gt;Java-&gt;Springboot,Technology-&gt;Reactive Programming-&gt;react JS\n\nPrimary skill: Well-versed with Java Best practices, Microservice Architecture &amp; Design Patterns, API Development &amp; DevOps Tools\n\n\n\n-  Primary skill: Strong expertise / hands-on in developing Microservice based APIs using Java 8 &amp; above / Spring / Spring Boot / REST Services / JPA.\n-  Primary skill: Good hands-on experience in databases like Oracle, MongoDB etc..\n-  Primary skill: Strong Experience with ReactJS, REST, OOP &amp; prototypal inheritance\n-  Primary skill: Experience using Web UI Debugging tools (firebug, chrome dev tools, windows script debugger, etc.)\n-  Primary Skill: Experience building Single Page Applications with JavaScript\n-  Secondary skill: Experience in Distributed Event streaming platforms like Kafka.\n-  Secondary skill: Proficient in DevOps / API monitoring Tools like Git, Bitbucket, Jenkins (CI/CD), Maven, Datadog, Prometheus, Splunk etc...\n-  Secondary skill: Exposure to Docker, Kubernetes &amp; various cloud solutions like Azure / AWS, Hibernate will be an added advantage.\n-  Secondary skills: Possess immense knowledge in code review, automated unit / integration testing or code review tools like Check Style, Find Bugs, SonarQube, Sonar Lint, Jacoco, Junit, Mockito\n-  Secondary skill: Development Experience using Agile / Scrum methodology.","postedAt":"2026-09-06","url":"https://in.linkedin.com/jobs/view/java-full-stack-react-developer-at-infosys-4444801620?position=17&pageNum=0&refId=N2LuctobqEKyAocpvhqoJg%3D%3D&trackingId=OVn7ghjcuJdhFBY4c0mWpg%3D%3D","companySizeRaw":373907,"fitScore":54,"tier":"stretch","matchedSkills":["react","mongodb","javascript","java","docker","ci/cd"],"missing":[]},{"source":"LinkedIn","title":"Fullstack (React JS + Node JS) Developer","company":"Infosys","location":"Bengaluru East, Karnataka, India","description":"Minimum Qualifications:\n\n\n\n-  3–5 years of hands-on experience in fullstack development with strong proficiency in ReactJS and Node.js.\n-  Strong understanding of JavaScript/TypeScript fundamentals, asynchronous programming, and modern frontend patterns.\n-  Experience building and consuming APIs, handling state management, and integrating frontend-backend workflows.\n-  Working knowledge of testing practices, debugging, and version control (Git).\n-  Education: BE, ME, BTECH, MTECH, MCA, MSC, MBA (or equivalent practical experience). Key Responsibilities: Fullstack Feature Delivery\n-  Design, develop, and ship end-to-end features using ReactJS on the frontend and Node.js on the backend.\n-  Translate product requirements into clean, maintainable UI components and backend services.\n-  Build reusable components, shared utilities, and scalable patterns to accelerate delivery. Backend &amp; API Development\n-  Develop RESTful APIs and backend modules in Node.js with clear contracts, validation, and error handling.\n-  Integrate backend services with frontend workflows, ensuring consistency, reliability, and performance.\n-  Implement authentication/authorization flows and secure data handling practices. Quality, Performance &amp; Collaboration\n-  Write unit/integration tests and participate in code reviews to maintain high engineering standards.\n-  Optimize frontend rendering and backend response times through profiling and performance tuning.\n-  Collaborate with designers, QA, and stakeholders to deliver polished releases and iterate based on feedback. AI-Enabled Enhancements\n-  Contribute to AI-assisted features such as intelligent recommendations, summarization, or workflow automation where applicable.\n-  Support integration of AI capabilities into the application while ensuring usability, safety, and measurable outcomes. About us: Infosys is a global leader in next-generation digital services and consulting. We enable clients in more than 50 countries to navigate their digital transformation. With over four decades of experience in managing the systems and workings of global enterprises, we expertly steer our clients through their digital journey. We do it by enabling the enterprise with an AI-powered core that helps prioritize the execution of change. We also empower the business with agile digital at scale to deliver unprecedented levels of performance and customer delight. Our always-on learning agenda drives their continuous improvement through building and transferring digital skills, expertise, and ideas from our innovation ecosystem. Infosys provides equal employment opportunities to applicants and employees without regard to race, color, sex, gender identity; sexual orientation, religious practices and observances; national origin; pregnancy, childbirth, or related medical conditions; status as a protected veteran or spouse/family member of a protected veteran; or disability.","postedAt":"2026-09-06","url":"https://in.linkedin.com/jobs/view/fullstack-react-js-%2B-node-js-developer-at-infosys-4444687936?position=19&pageNum=0&refId=GZTwRUJWAOSRSX0Tb4EaYQ%3D%3D&trackingId=D8rkJ2Ufucd%2FRuXqS8%2BxHA%3D%3D","companySizeRaw":373907,"fitScore":54,"tier":"stretch","matchedSkills":["react","node","typescript","javascript","java","restful","ai-powered","ai-assisted"],"missing":["3+ yrs required"]},{"source":"LinkedIn","title":"Senior Full Stack Developer - Node.js/React.js","company":"NetConnect  AS","location":"Bengaluru, Karnataka, India","description":"About The Role\n\nThis is not a role where you maintain a dashboard and close tickets. We build AI-native enterprise software. Real-time multilingual voice, heavy data pipelines, multi-tenant systems, and interfaces that thousands of people sit inside all day, across India, the UK and Europe.\n\nThe work is hard in the way good engineering work is hard. Latency budgets you actually have to hit. Queries that fall apart at scale unless you think about them properly. UI that has to stay responsive while streaming data in from three places at once.\n\nIf you like being handed a spec and told what to type, this will not suit you. If you like owning a hard problem end to end and being the person accountable for it, keep reading.\n\nWhat You'll Be Doing\n\nOn the backend:\n\n\n\n-  Design and own services in Node and TypeScript, sitting on PostgreSQL.\n-  Model data properly. Normalised where it matters, denormalised where it earns you something. You should be comfortable reasoning about foreign keys, partial and composite indexes, and what a covering index actually buys you.\n-  Read query plans. Kill N+1s. Understand connection pooling, transaction isolation levels, advisory locks, and why a long-running transaction on a hot table ruins everyone's afternoon.\n-  Build multi-tenant boundaries that hold. Tenant scoping, RBAC, row-level isolation, audit trails. Getting this wrong in enterprise software is not a bug, it is an incident.\n-  Work with event-driven flows. Queues, workers, retries with backoff, idempotency keys, dead letter handling, backpressure. Exactly-once is a lie, design for at-least-once and make it safe.\n-  Caching that is actually correct. Cache-aside patterns, TTL strategy, stampede protection, distributed locks, and knowing when invalidation is the wrong answer.\n-  Real-time paths. SSE and WebSockets, streaming responses, connection lifecycle, reconnection semantics.\n-  Integrate with enterprise systems designed in a different decade. Legacy file transfer, XML and SOAP-ish APIs, webhook contracts, OAuth flows, rate limits you do not control.\n\nOn The Frontend\n\n\n\n-  Build in React and TypeScript on a modern Next.js setup. Server components, client components, and a clear head about which does what and why.\n-  Streaming SSR, suspense boundaries, route-level code splitting, and hydration behaviour you can explain rather than guess at.\n-  Own Core Web Vitals. LCP, INP, CLS. Bundle analysis, dependency pruning, font and image strategy, no waterfalls in the data layer.\n-  Complex stateful UI. Server state in a proper query cache, client state kept minimal, optimistic updates, race condition handling, stale data reconciliation.\n-  Data-dense interfaces done well. Virtualised tables, infinite scroll, filter and sort state in the URL, forms with schema validation on both sides of the wire.\n-  Real-time UI that does not thrash. Streaming tokens, live status, presence, without re-rendering the world every tick.\n-  A design system that stays consistent. Typed component APIs, sensible primitives, accessibility that is not an afterthought.\n\nAcross Both\n\n\n\n-  Own features from schema to screen. You design the tables, write the API, build the UI, ship it, and watch what happens after.\n-  Review code seriously and push back when something is wrong.\n-  Argue about what to build, not just how.\n\nThe Kind Of Stack You'll Be In\n\n\n\n-  Languages: TypeScript end to end, SQL.\n-  Frontend: React, Next.js, a component library, utility CSS, schema validation.\n-  Backend: Node.js, a lightweight HTTP framework, a typed query layer, REST and streaming APIs.\n-  Data: PostgreSQL, Redis, object storage.\n-  Cloud: AWS across multiple regions. Serverless functions, managed queues, CDN, managed Postgres and cache.\n-  AI layer: LLM APIs, function calling, streaming inference, real-time voice.\n\nYou do not need every one of these on your CV. You do need to be the kind of engineer who picks up a new one over a weekend and is useful on Monday.\n\nWhat We're Looking For\n\n\n\n-  5 to 7 years building production web systems. Real users, real load, real consequences when it breaks.\n-  Deep TypeScript. Generics, discriminated unions, inference. You use the type system to prevent bugs, not to decorate the code.\n-  Strong React. You know why a component re-rendered and how to stop it. You know when memoisation helps and when it is cargo cult.\n-  Genuinely comfortable in a database. You can write the SQL yourself and you know what the ORM is doing when you don't.\n-  You have designed an API someone else had to consume and it held up.\n-  You have debugged something in production under pressure and written up what went wrong afterwards.\n-  You write code a stranger can read in six months.\n\nOn background: We lean towards engineers who have worked at a startup where they had to own a lot without a playbook, or who come from a strong engineering school (IIT, NIT, BITS, IIIT and similar). Both is ideal. Neither is a dealbreaker if the work speaks loudly enough. Send the GitHub, the side project, the thing that got used.\n\nNice To Have\n\n\n\n-  Worked with LLM APIs, streaming completions, prompt and eval design, or real-time voice.\n-  Built multi-tenant B2B SaaS with enterprise customers.\n-  Performance work you can talk about specifically. What was slow, what you measured, what you changed.\n-  Open source contributions, or a technical blog where you explain things properly.\n-  You have been the first or second engineer on something.\n\nWhat Working Here Is Like\n\n\n\n-  Fast. Really fast. Decisions get made in one conversation, not across weeks of meetings. There is no ticket queue you sit in. If you see something broken you fix it.\n-  You get the whole picture. Founders sit in the same room. You will know what we are prioritising and why.\n-  The flip side is ownership. Nobody chases you for status. Ship it, tell the team, move on.\n\nWhat You Get\n\n\n\n-  Competitive salary, benchmarked properly for senior engineers in Bengaluru.\n-  Real ownership of systems that carry weight, not a slice of someone else's feature.\n-  Hard problems, short feedback loops, and no layers between you and the outcome.\n-  A team where you will not be the smartest person in the room every day.\n\n(ref:hirist.tech)","postedAt":"2026-09-09","url":"https://in.linkedin.com/jobs/view/senior-full-stack-developer-node-js-react-js-at-netconnect-as-4464929429?position=16&pageNum=0&refId=GZTwRUJWAOSRSX0Tb4EaYQ%3D%3D&trackingId=sc8NyTn9r%2FD5jX9cm4oHoA%3D%3D","companySizeRaw":127,"fitScore":53,"tier":"stretch","matchedSkills":["react","node","typescript","next.js","llm"],"missing":[]},{"source":"LinkedIn","title":"MERN Full Stack Developer","company":"Workfall","location":"Bengaluru, Karnataka, India","description":"\nWe are looking for a talented MERN Full Stack Developer with strong expertise in JavaScript, TypeScript, and full-stack frameworks like Node.js and React.js. The ideal candidate will be responsible for designing, developing, and deploying scalable, high-quality applications while collaborating closely with cross-functional teams.\n\n\nLocation: Bengaluru (On-site)\nExperience: 5+ years\nEmployment: Full-time\n\n\nKey Responsibilities:\n\n- Design, develop, and maintain end-to-end web applications using Node.js (backend) and React.js (frontend).\n- Build RESTful APIs, microservices, and backend systems with clean, scalable architectures.\n- Develop responsive, user-friendly front-end components and UI features using React.\n- Work with databases such as PostgreSQL, MySQL, or MongoDB.\n- Collaborate with Product, UX, and QA teams to deliver high-quality features.\n- Write clean, maintainable, and testable code following best practices.\n- Particip     if (state.last !== today) {
