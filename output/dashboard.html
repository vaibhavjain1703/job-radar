ineering craft and the gov tech domain.\n\n\nKey Responsibilities\n\n\n• Build prototypes: Turn experiment briefs into working prototypes under the direction of the AI Tech Lead — using foundation models, LLM APIs, prompting, RAG and related techniques.\n• Evaluation and evidence: Help design and run evaluations of prototypes for quality, reliability and latency, and capture results, limitations and observations clearly.\n• Engineering quality and SDLC: Follow a disciplined development lifecycle — version control, code review, automated testing and continuous integration — writing clean, tested, documented and reproducible code.\n• Reusable components: Contribute to shared components, evaluation harnesses and starter repositories that raise the Lab’s throughput.\n• Handover-readiness: Produce clear technical notes and documentation so prototypes are transferable rather than black boxes.\n• Communicate and collaborate: Pair with the Tech Lead and partner engineers, present at sprint showcases, and communicate progress, results and blockers clearly to technical and non-technical audiences.\n\n\nRequired Skills &amp; Experience\n\n\n1. Foundations: 0–2 years of experience; freshers welcome. Strong computer-science fundamentals — data structures, algorithms and clean coding practice. A degree in computer science or engineering, or equivalent demonstrable ability.\n2. Applied AI (core): Hands-on experience building with LLMs and modern AI tools — through work, internships, academic, hackathon or personal projects. Familiarity with prompting, LLM APIs and at least one AI/GenAI framework. Comfortable using AI-assisted development tools (Claude, ChatGPT, Cursor, GitHub Copilot) as part of everyday building.\n3. Programming: Strong in at least one language, with Python preferred for AI work. Exposure to web or full-stack development; willingness to work across the DIGIT stack (Java, React, Flutter) is an advantage.\n4. SDLC and engineering craft: Good grasp of the software d
