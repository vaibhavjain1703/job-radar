aintain partnership with business and IT stakeholders\n- Attention to Detail: Ensure accuracy and thoroughness in all tasks.\n\nTechnical/Business Skills\n\n\n\n- Strong experience building web applications using React.js and JavaScript/TypeScript.\n- Strong experience developing backend services using Java, Spring Boot, and microservices architecture.\n- Experience implementing event-driven architecture using Kafka.\n- Experience using Python for automation, data processing, or backend services.\n- Advanced SQL development and database design experience with Oracle and Netezza.\n- Experience designing and consuming REST APIs.\n- Experience with GitLab, CI/CD pipelines, Jira, and Confluence.\n- Experience working in Agile/Scrum environments.\n- Excellent ability to communicate technical information clearly and work effectively with cross-functional teams\n- Strong analytical and problem-solving skills\n- Experience with cloud platforms (AWS) and container technologies such as Docker and Kubernetes is preferred.\n- Experience within financial services, banking, risk, treasury, forecasting, or regulatory reporting environments is highly desirable.\n\nRelationships &amp; Collaboration\n\n\n\n- Reports to: Senior Manager - Data Engineering\n- Partners: Senior leaders and cross-functional teams\n- Leads: A team of Data Engineering associates\n\nAccessibility Needs\n\nWe are committed to providing an inclusive and accessible hiring process. If you require accommodations at any stage (e.g. application, interviews, onboarding) please let us know, and we will work with you to ensure a seamless experience.\n\nEqual Employment Opportunity\n\nFC Global Services India LLP (First Citizens India) is an Equal Employment Opportunity Employer. We are committed to fostering an inclusive and accessible environment and prohibit all forms of discrimination on the basis of gender, religion, caste, disability, sexual orientation, economic status or any other characteristics protected by th   const listEl = document.getElementById('list');
  function render(tier) {
    const jobs = tiers[tier] || [];
    listEl.innerHTML = jobs.length
      ? jobs.map(j => `
        <div class="card" data-tier="${j.tier}">
          <div class="card-top">
            <div>
              <p class="card-title">${j.title}</p>
              <p class="card-sub"><b>${j.company}</b> · ${j.location || "Location n/a"} · ${j.source}</p>
            </div>
            <div class="score"><div class="num">${j.fitScore}</div><div class="lbl">fit score</div></div>
          </div>
          <div class="tags">${(j.matchedSkills||[]).slice(0,6).map(t=>'<span class="tag">'+t+'</span>').join('')}${(j.missing||[]).map(t=>'<span class="tag miss">'+t+'</span>').join('')}</div>
          <div class="card-foot">
            <span class="posted">${j.postedAt ? new Date(j.postedAt).toLocaleDateString() : "Date n/a"}</span>
            <a class="apply" href="${j.url}" target="_blank" rel="noopener">View / Apply →</a>
          </div>
        </div>`).join('')
      : '<div class="empty">No roles in this tier right now.</div>';
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    render(t.dataset.tier);
  }));
  render('high');

  // Check-in streak, stored in this browser's localStorage (real page, not a sandboxed artifact)
  (function(){
    const today = new Date().toISOString().slice(0,10);
    const raw = localStorage.getItem('jobradar_streak');
    let state = raw ? JSON.parse(raw) : { streak: 0, last: null };
    if (state.last !== today) {
      const gapDays = state.last ? Math.round((new Date(today) - new Date(state.last)) / 86400000) : null;
      state.streak = gapDays === 1 ? state.streak + 1 : 1;
      state.last = today;
      localStorage.setItem('jobradar_streak', JSON.stringify(state));
    }
    document.getElementById('streakbar').innerHTML =
      '🔥 ' + state.streak + '-day check-in streak · Last refreshed by the daily job: ' + new Date("2026-10-05T09:28:19.629Z").toLocaleString();
  })();
