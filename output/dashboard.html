rstanding of APIs, microservices architecture, CI/CD practices, and cloud fundamentals is expected.\n\nAwareness of AI/LLM concepts, including prompt engineering, AI-assisted development, and basic evaluation techniques, is a plus. Familiarity with testing, debugging, logging, and structured development workflows will help you contribute from the start.\n\n1 to 3 years of relevant experience in software development with master’s or bachelor’s degree in computer science, engineering or equivalent.\n\nWhat You'll Build\n\nYou'll contribute to AI-enabled application features in SAP Concur Travel through coding, testing, and debugging. LLM integration tasks, prompt testing, and AI output validation are part of the regular work. You'll help prepare evaluation datasets and participate in benchmarking workflows. System logs, metrics, and application behavior are things you'll monitor to spot issues and support observability improvements. CI/CD pipelines, deployment support, and basic automation workflows are areas where you'll contribute, along with maintaining clear documentation.\n\nWhere you belong\n\nYou will join the SAP Concur Travel Engineering AI &amp; Core team in Labs India. SAP Concur offers cloud-based services that make it simple to manage travel and expenses. SAP Concur supports more than 54,000 businesses and 96 million users across 150+ countries, processing over one billion transactions annually.\n\nYou'll work in a collaborative, global engineering environment with access to mentorship and structured learning. Knowledge sharing and honest technical feedback are part of how this team operates. You'll gain hands-on exposure to AI-first systems and modern development practices, not just observe them. If you're early in your career and want to build real technical depth in AI-native application engineering, this is a good fit.\n\nSkills\n\nWe value the skills you bring and support you to build on them through our learning and development opportunities. These e compatible</li> <li>MERN full stack developer must have the ability to wear many hats and learn new technologies quickly</li> <li>For MERN stack developer job, candidate must have good Knowledge of Node Debugging</li> <li>Understanding proficiency in REST APIs.</li> <li>MERN stack developers should know Git Repository and Jira.</li> <li>Integration of data storage solutions [RDBMS, NoSQL DB]</li> </ul> <h3>Mandatory Skills Knowledge</h3> <ul> <li>Excellent in basic programming in any web technology Server and Client</li> <li>Like JAVA, ReactJS/Angular/VueJS and Server-side scripts</li> <li>Basic knowledge in APIs, Micro Services</li> <li>Hands-On experience in Web development frameworks</li> <li>Hands-On in Database queries and concepts</li> <li>Understanding of performance testing and optimization techniques</li> </ul> <h3>What youll do</h3> <ul> <li>Own delivery for client-facing web, mobile, AI, cloud or digital transformation work based on the role.</li> <li>Collaborate with project managers, designers, QA and client stakeholders through discovery, build, launch and support.</li> <li>Write clear documentation, communicate risks early and keep delivery quality high.</li> <li>Contribute to reusable engineering practices, reviews and mentoring inside the WebSenor team.</li> </ul> <h3>What were looking for</h3> <ul> <li>Strong hands-on experience relevant to this role and a portfolio of shipped production work.</li> <li>Clear communication, ownership mindset and ability to work with global clients.</li> <li>Comfort with delivery discipline: estimation, reviews, testing, documentation and release readiness.</li> <li>Ability to learn fast and work across modern product, engineering and AI-enabled workflows.</li> </ul> <h3>What youll get</h3> <ul> <li>Work on real enterprise client projects with measurable business outcomes.</li> <li>Collaborate with experienced engineering, design, QA and delivery teams.</li> <li>Growth through mentoring, project ownership and exposure to global clients.</li> <li>HR-approved compensation, benefits and policies as finalized during the offer process.</li> </ul> <h3>About the team</h3> <p>You will work with WebSenor project managers, UI/UX designers, QA engineers, cloud specialists and senior developers focused on quality delivery for enterprise clients.</p> <h3>Our hiring process</h3> <ul> <li><strong>Application Review:</strong> HR and delivery leadership review your profile for role fit.</li> <li><strong>Technical Discussion:</strong> Meet the technical team for skill, communication and project-readiness evaluation.</li> <li><strong>Final Conversation:</strong> Discuss compensation, joining timeline and team fit.</li> <li><strong>Offer and Onboarding:</strong> Receive the offer, documentation checklist and onboarding plan.</li> </ul><br><br>Disclaimer: This job posting has been aggregated from external source. Role details, content, and availability are subject to change. Applicants are advised to confirm the latest information directly on the company website before applying.","postedAt":null,"url":"https://www.naukri.com/job-listings-mern-stack-developer-websenor-bengaluru-2-to-7-years-121126500088","companySizeRaw":null,"fitScore":66,"tier":"medium","matchedSkills":["react","node","express","mongodb","javascript","java","rest api","restful","nosql"],"missing":[]}],"stretch":[{"source":"LinkedIn","title":"Engineer 2","company":"Styli","location":"Bengaluru, Karnataka, India","description":"\nRole: Engineer 2\nLocation: Bangalore\n\n\nWe are seeking a talented and motivated Fullstack MERN Developer to join our dynamic team. The ideal candidate will have a strong foundation in building scalable web applications using the MERN (MongoDB, Express.js, React.js, Node.js) stack, along with a proven track record of developing both front-end and backend systems. You will work closely with cross-functional teams to design, develop, and deploy high-quality software solutions that align with business goals.\n\n\nKey Responsibilities \n● Develop, test, and maintain scalable web applications using the MERN stack.\n● Collaborate with UI/UX designers to translate designs into responsive and intuitive front-end interfaces.\n● Build and integrate RESTful APIs and ensure seamless data flow between front-end and back-end systems.\n● Optimize application performance, scalability, and reliability.\n● Debug and resolve technical issues across the stack.\n● Write clean, reusable, and well-documented code following best practices.\n● Work in an Agile environment, participating in sprints, stand-ups, and code reviews.\n● Ensure code quality through unit testing and integration testing.\n● Stay updated with emerging technologies and contribute to continuous improvement initiatives.\n\n\nRequired Skills and Qualifications: \n● Experience: 3-5 years of hands-on experience in fullstack development using the MERN stack.\n● Front-end: Strong proficiency in React.js, Redux, or similar state management libraries.\n● Back-end: Experience with Node.js, Express.js, and building RESTful APIs.\n● Database: Proficiency in MongoDB, including designing schemas and optimizing queries.\n● Familiarity with version control tools like Git.\n● Strong understanding of HTML5, CSS3, and JavaScript (ES6+).\n● Knowledge of authentication and authorization mechanisms (e.g., JWT, OAuth).\n● Hands-on experience with deploying and maintaining applications on cloud platforms (AWS, Azure, or similar).\n● Experience with CI/CD pipelines and DevOps practices.\n\n\nPreferred Skills \n● Experience with TypeScript.\n● Knowledge of GraphQL.\n● Familiarity with Docker and containerization.\n● Exposure to serverless architecture.\n● Basic understanding of testing frameworks like Jest, Mocha, or Cypress.\n\n\nSoft Skills \n● Strong problem-solving skills and attention to detail.\n● Excellent communication and teamwork abilities.\n● Ability to work in a fast-paced environment and manage multiple tasks.\n● Education Bachelor’s or Master’s degree in Computer Science, Engineering, or related fields (or equivalent experience)","postedAt":"2026-11-16","url":"https://in.linkedin.com/jobs/view/engineer-2-at-styli-4489722153?position=1&pageNum=0&refId=h5PaElQkbdp1a%2FPcG8P44A%3D%3D&trackingId=Y4vCOC2cyWPUELmV9et7Pw%3D%3D","companySizeRaw":null,"fitScore":62,"tier":"stretch","matchedSkills":["react","node","express","mongodb","typescript","javascript","java","restful","docker","ci/cd"],"missing":["3+ yrs required"]},{"source":"LinkedIn","title":"AI Engineer","company":"TerraTern","location":"Bengaluru, Karnataka, India","description":"About The Job\n\nDepartment: Technology &amp; Product\n\nEmployment Type: Full-time\n\nAbout TerraTern\n\nTerraTern is one of India’s fastest-growing Global Talent Mobility startups, helping individuals navigate international relocation with confidence. We deliver end-to-end visa support, job search guidance, and mobility resources designed for global aspirants. Transparency, precision, and client trust are the foundation of everything we build.\n\nRole Overview\n\nWe are looking for an AI Engineer to build products that use large language models to help people plan their move abroad. You will work with our product and tech teams to take an idea from a rough sketch to a working feature that real users rely on. Freshers with good projects and a strong interest in AI are welcome to apply.\n\nKey Responsibilities\n\n\n\n- Build AI features using LLM APIs, such as chat assistants, document readers and smart search.\n- Set up RAG systems so our AI answers from TerraTern’s own trusted information.\n- Create AI agents and workflows that handle repeat tasks for our users and our team.\n- Connect AI features to our website, apps and internal tools through clean APIs.\n- Test every feature on real questions, and fix wrong or unclear answers before users see them.\n- Watch speed, cost and accuracy after launch, and bring all three in line.\n- Work with product managers and designers so each feature is easy to use and solves a real problem.\n\nEligibility &amp; Requirements\n\n\n\n- 1 to 3 years of experience building software or AI applications, or a fresher with strong projects, internships or open-source work.\n- Bachelor’s or Master’s degree in Computer Science, Engineering, AI or a related field.\n- Good Python skills, and comfort with APIs, Git and a database.\n- Hands-on use of at least one LLM API such as OpenAI, Claude or Gemini.\n- Basic understanding of embeddings, vector search and prompt design.\n- Clear communication, and the ability to explain technical ideas in simple words.\n- Curiosity, ownership and a habit of finishing what you start.\n\nNice to Have\n\n\n\n- Experience with LangChain, LlamaIndex, n8n or similar tools.\n- A deployed AI project, even a small personal one.\n- Interest in immigration, education or global careers.\n\nWhy Join TerraTern\n\n\n\n- Impactful Work: Build tools that help people reach jobs and study options abroad.\n- Professional Growth: Learn from the team and work on real AI products from day one.\n- Entrepreneurial Culture: Share your ideas, try them out and own the result.\n- Collaborative Environment: Work closely with product, sales and operations in a team that likes to learn together.\n\nSkills: llms,agents,api,ai,ml,prompt engineering,langchain,rag,python","postedAt":"2026-11-14","url":"https://in.linkedin.com/jobs/view/ai-engineer-at-terratern-4489860676?position=20&pageNum=0&refId=JNRUCHnINPhn9M6u5zpKuQ%3D%3D&trackingId=VhZbSfn9xInfthgZM3Ol4g%3D%3D","companySizeRaw":100,"fitScore":62,"tier":"stretch","matchedSkills":["llm","claude","openai","gemini"],"missing":[]},{"source":"LinkedIn","title":"AI Forward Deployed Engineer (AI FDE)","company":"TerraTern","location":"Bengaluru, Karnataka, India","description":"About The Job\n\nDepartment: Founder’s Office\n\nEmployment Type: Full-time\n\nAbout TerraTern\n\nTerraTern is one of India’s fastest-growing Global Talent Mobility startups, helping individuals navigate international relocation with confidence. We deliver end-to-end visa support, job search guidance, and mobility resources designed for global aspirants. Transparency, precision, and client trust are the foundation of everything we build.\n\nRole Overview\n\nWe are looking for an AI Forward Deployed Engineer to sit close to our founders and our teams, find the slow and manual parts of our work, and fix them with AI. You will not wait for a long spec. You will talk to the people doing the work, build a working solution quickly, and stay with it until it makes their day easier. Freshers with good projects and a strong urge to build are welcome to apply.\n\nKey Responsibilities\n\n\n\n- Work with the founders and team leads in sales, counselling, operations and marketing to understand where time and effort are being lost.\n- Build AI tools and automations for those problems, using LLM APIs, agents and no-code tools such as n8n.\n- Ship small working versions fast, put them in front of the team, and improve them based on real feedback.\n- Identify the bottlenecks, go into the depth of the problem and solve it from the roots using AI, wear any hat as per the requirements\n- Train team members to use what you build, and stay with them until they are comfortable.\n- Track the time saved and the results each tool brings, and share them with the founders.\n- Write simple notes on how each tool works, so anyone on the team can run and fix it.\n\nEligibility &amp; Requirements\n\n\n\n- 1 to 3 years of experience in software, automation or AI work, or a fresher with strong projects, internships or a good portfolio.\n- Bachelor’s or Master’s degree in Computer Science, Engineering or a related field.\n- Good Python skills, and comfort with APIs, SQL and Git.\n- Hands-on use of at least one LLM API such as OpenAI, Claude or Gemini.\n- Clear communication, and the ability to explain technical ideas in simple words to people who are not technical.\n- Comfort with unclear problems, and the habit of asking good questions before building.\n- High ownership, a strong sense of urgency and a habit of finishing what you start.\n\nNice to Have\n\n\n\n- Experience with n8n, Zapier, Make or similar automation tools.\n- Experience with RAG, agents or chat assistants.\n- A project you built and shipped that real people used, even a small one.\n- Interest in immigration, education or global careers.\n\nWhy Join TerraTern\n\n\n\n- High Impact: Build tools that your own colleagues use every day, and see the result within days.\n- Fast Growth: Work close to the founders and learn how a business runs while you build for it.\n- Entrepreneurial Culture: Share your ideas, try them out and own the result.\n- Collaborative Environment: Work with every team in the company, in a group that likes to learn together.\n\nSkills: product,automation,ownership,apis,agents","postedAt":"2026-11-14","url":"https://in.linkedin.com/jobs/view/ai-forward-deployed-engineer-ai-fde-at-terratern-4489876268?position=19&pageNum=0&refId=JNRUCHnINPhn9M6u5zpKuQ%3D%3D&trackingId=HcSZxPeZ4ml9lOc%2B1i4E%2BQ%3D%3D","companySizeRaw":100,"fitScore":62,"tier":"stretch","matchedSkills":["llm","claude","openai","gemini"],"missing":[]},{"source":"LinkedIn","title":"Engineer Software - AI/Agentic AI [T500-30274]","company":"Albertsons Companies India","location":"Bengaluru, Karnataka, India","description":"\nAbout Albertsons:\nAs a leading food and drug retailer in the United States, Albertsons Companies, Inc. (ACI) operates over 2,200 stores across 34 states and the District of Columbia. Our well-known global banners, including Albertsons, Safeway, Vons, Jewel-Osco and others. Our success is built upon a united team approach, driven by the desire to understand and enhance the customer experience. This customer-centric focus not only inspires innovation but has also led to remarkable achievements across our digital platforms and omnichannel strategies. By constantly pushing the boundaries of retail, we have transformed shopping into an experience that is not just easy and efficient, but also fun and engaging. Over the past year, we have taken bold, strategic steps to migrate and modernize our enterprise data hub on Google Cloud, revolutionizing our data capabilities, thus becoming the first fully cloud-based grocery tech company.\n\n\nAbout Tech Hub in India:\nAlbertsons Companies India (ACI India) is part of Albertsons Companies Inc. global workforce. As Albertsons' first significant strategic investment in India, it serves as a collaborative hub, supporting Albertsons in driving innovation and efficiency across Technology, Digital, and other key business functions. The employees at the India GCC will play a pivotal role in enhancing the company's digital transformation, customer engagement, and operational excellence.\n\n\nWe are excited to announce an opening for Software Engineer I, AI Engineering (AIDLC) at ACI. Please find below the details of the role and its responsibilities. \nPosition Title: Software Engineer I, AI Engineering (AIDLC) \nRoles &amp; responsibilities: \n\n- Build and test parts of agents for the AIDLC (AI-driven development lifecycle) pod, guided by senior engineers. \n- Contribute to agents for stages of the software development lifecycle: requirements and design, code review before merge, security-finding remediation, test generation, release and path to production, and SRE and incident support. \n- Implement tool/function calling and use MCP servers, including code knowledge graphs exposed over MCP, in the agents you work on. \n- Implement RAG pipelines and basic memory and state handling for your agents. \n- Write evals for the parts you build: a small golden dataset, simple LLM-as-judge checks and regression tests. Run them before each change. \n- Add tracing and logging to your agents, and use traces to debug failures. \n- Follow the pod's guardrails, including prompt-injection defenses and human-in-the-loop approval points. \n- Write production code every week. Use agentic coding tools daily (e.g. Claude Code, GitHub Copilot, Cursor) and check every change they produce before you commit it. \n- Take part in code and agent reviews, and learn from the feedback. \n- Report how your agents perform against the baseline the pod sets, and learn to watch token cost. \n- Work with senior engineers and partner teams to meet security and compliance standards. \n\n\nExperience Required: \n\n- AI experience is a MUST. You have built an LLM agent or RAG application end to end, with at least one eval. An AI internship, coursework or a personal project counts. Describe it in your application or link a repo or demo. \n- 1-3 years of software engineering experience. Recent graduates with a strong AI project or internship are welcome to apply. There is no CGPA cutoff. \n- Programming fundamentals in Python, Java or TypeScript: you write clean, tested code. \n- Prompt engineering basics, and tool/function calling and MCP basics. Frameworks are examples only (e.g. LangGraph, LangChain/LangSmith, Claude Agent SDK, OpenAI Agents SDK, Google ADK). \n- Understanding of RAG and of how an agent keeps memory and state. \n- Understanding of how to evaluate an LLM application with a golden dataset, and why tracing matters. \n- Responsible use of AI coding tools (e.g. Claude Code, GitHub Copilot, Cursor): you review and understand code before you accept it, and you know when not to trust the output. \n- A plus: cloud exposure on Azure and/or Google Cloud Platform. \n- Willingness to learn from code reviews and from senior engineers. \n\n\nCompetencies: \n\n- Compassionate and kind, showing courtesy, dignity, and respect. They show sincere interest and empathy for all others. \n- Foster innovation through creativity to get to a workable solution. Use analytical thinking through issues using logic and reason \n- Show integrity in what is done and how it is done - without sacrificing personal/b s\n- Strong coding in one or more programming languages such as Java, Python, C++, or Go. \n- Expert understanding of data structures, algorithms, software design principles and low level design\n- Ability to communicate clearly and work effectively in a collaborative environment\n- Understanding of system design and complex distributed systems\n- Eagerness to learn new technologies and apply them to solve real-world problems. \n- Bonus points for open source contributions, competitive coding experience, and a strong Computer Science background from a Tier 1 institution. \n\nAdditional Information\n\nRippling is an equal opportunity employer. We are committed to building a diverse and inclusive workforce and do not discriminate based on race, religion, color, national origin, ancestry, physical disability, mental disability, medical condition, genetic information, marital status, sex, gender, gender identity, gender expression, age, sexual orientation, veteran or military status, or any other legally protected characteristics, Rippling is committed to providing reasonable accommodations for candidates with disabilities who need assistance during the hiring process. To request a reasonable accommodation, please email accomodations@rippling.com\n\nRippling highly values having employees working in-office to foster a collaborative work environment and company culture. For office-based employees (employees who live within a defined radius of a Rippling office), Rippling considers working in the office, at least three days a week under current policy, to be an essential function of the employee's role.","postedAt":"2026-11-13","url":"https://in.linkedin.com/jobs/view/software-engineer-i-at-rippling-4490713187?position=7&pageNum=0&refId=JNRUCHnINPhn9M6u5zpKuQ%3D%3D&trackingId=B3idARrwiWUb%2BdPCFS6UDQ%3D%3D","companySizeRaw":7885,"fitScore":53,"tier":"stretch","matchedSkills":["express","java","data structures","algorithms","ai-powered","ai-assisted"],"missing":[]},{"sourc ically requires a minimum of 6 years of related experience.\n\nAt NetApp, we embrace a hybrid working environment designed to strengthen connection, collaboration, and culture for all employees. This means that most roles will have some level of in-office and/or in-person expectations, which will be shared during the recruitment process.\n\nEqual Opportunity Employer:\n\nNetApp is firmly committed to Equal Employment Opportunity (EEO) and to compliance with all federal, state and local laws that prohibit employment discrimination based on age, race, color, gender, sexual orientation, gender identity, national origin, religion, disability or genetic information, pregnancy, protected veteran status, and any other protected classification.\n\nWhy You'll Thrive at NetApp\n\nAt NetApp, you won't wait for the perfect moment—you'll make it. The early planning, the extra thought, the bold idea that turns good into great: That's how our people operate and how we continue to push the boundaries of data infrastructure.\n\nNetApp is the trusted partner for organizations transforming data into opportunity. As the only enterprise-grade storage service natively embedded in Google Cloud, AWS, and Microsoft Azure, we empower customers to run everything from traditional workloads to enterprise AI with unmatched performance, resilience, and security.\n\nOur culture\n\nWe celebrate mold breakers, bold thinkers, and problem solvers. We reward initiative, impact, and ownership. We provide flexibility so you can balance professional ambition with your personal life. Here, differences are not just welcomed—they drive everything we do.\n\nIf you're ready to innovate, rise to the challenge, and own every moment - make your next move your best one. Apply now.\n\nSubmitting an Application\n\nTo ensure a streamlined and fair hiring process for all candidates, our team only reviews applications submitted through our company website. This practice allows us to track, assess, and respond to applicants efficiently. Emailing our employees, recruiters, or Human Resources personnel directly will not influence your application.\n\nAI Disclosure\n\nFor select roles, some stages of our hiring process may use artificial intelligence tools to help evaluate applications and candidate selection. These tools support—rather than replace—human decision-making.","postedAt":"2026-11-18","url":"https://in.linkedin.com/jobs/view/senior-software-engineer-full-stack-developer-at-netapp-4481895981?position=19&pageNum=0&refId=h5PaElQkbdp1a%2FPcG8P44A%3D%3D&trackingId=UxkEaSrnhzEfrxL9kfw37A%3D%3D","companySizeRaw":12736,"fitScore":50,"tier":"stretch","matchedSkills":["react","node","restful","ci/cd","llm"],"missing":[]}]};

  (function(){

    if (state.last !== today) {

      state.streak = gapDays === 1 ? state.streak + 1 : 1;
