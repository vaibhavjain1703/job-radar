rm change in K-12 education.\n\n\n\n\nHere’s what you’ll be doing\nWe are looking for a passionate and motivated product&nbsp;engineer&nbsp;who partners with us to build intuitive, scalable, and delightful user experiences for teachers, students, and parents.\n\n\nAs a product Engineer, you will contribute to designing, developing, and deploying high-quality product. You will collaborate closely with engineers, product managers, designers, educators, and gain exposure to real-world usage in schools.\n\n\nThis role offers hands-on ownership, continuous technical growth and product understanding in a fast-growing SaaS environment.\n\n\nWhat you’ll achieve in your first 3 months\n\n- Understand the codebase, architecture, and core product workflows\n- Build strong fundamentals in frontend and backend concepts\n- Start contributing to feature development, production fixes &amp; optimization\n\n\nWhat you’ll achieve in your first 6 months\n\n- Independently deliver major features by writing&nbsp;clean, modular, and optimized code\n- Participate in code reviews and collaborate cross-functionally\n\n\nWhat you’ll achieve in your first 12 months\n\n- Own modules&nbsp;end-to-end, coordinating closely with&nbsp;Product and Support teams&nbsp;through scoping, design review, development, release, and post-release support\n- Get the opportunity to work on&nbsp;performance, optmization and infra projects\n- Contribute to hiring, onboarding, technical knowledge sharing, and continuous improvement of engineering processes\n\n\nMust have Skills:\n\n- Frontend Languages &amp; Frameworks&nbsp;- JavaScript (ES6+) , HTML5 / CSS3, React, Redux/Apollo Client\n- Backend Languages &amp; Frameworks&nbsp;- Node.js, Express &amp; GraphQL,&nbsp;PostgreSQL\n- Tools &amp; Platforms&nbsp;- Git, Build tools (Webpack), Profiling tools (React Profiler, Memory profiling), GitHub Copilot or other AI-assisted development tools, Knex\n- Strong problem-solving skills and eagerness to learn\n- Ability to write clean, readable, and maintainable code\n\n\nGood to have:\n\n- Exposure to&nbsp;AWS ecosystem&nbsp;(Lambda, SQS, CloudWatch, API Gateway, etc.)\n- Working experience in ReactNative\n- Product mindset with empathy for end users\n- Clear communication skills and ability to collaborate cross-functionally\n- Past working experience in SaaS or product based companies\n\n\n\n\nIs this someone that looks like you?\n\n- Education: B.E/B.Tech degree\n- Experience: 2 to 5 years of relevant working experience (SaaS preferred) post graduation.\n- Soft Skills: Having a bias towards action, a good sense of design, empathy, and good communication skills\n- We deeply value building the right culture at Toddle, and these are a few things that we look for in each hire – Coach-ability, Curiosity, Ownership, Hustle, and Humility\n\n\n\n\nExcited about the role?\n\n\nHere are some more benefits:\n\n\n1) Flexibility at work\n\n- Work from anywhere - home, co-working space, cafe or even the hills\n- Block “no-meeting hours” to enable uninterrupted focused work\n\n\n2) Exposure to diverse learning opportunities\nWork across different projects &amp; teams to develop skills outside of your core expertise\n\n\n3) Industry best leave policy\nWe trust you fully on your commitment to our mission and your judgement on planning your time and taking leaves:\n\n- No cap on the number of sick or casual leaves\n- Special paid leaves for childbirth, wedding etc.\n- Menstrual leave\n\n\n4) No bell curve performance evaluations\nWe put in a lot of work to hire the best, and therefore we don’t expect anyone to deliver less than the best!\n\n\n5)&nbsp;And yes,&nbsp;a super fun and diverse group&nbsp;of folks to collaborate and grow with\nStill with us? Here’s the process:\n\n\n1) Shortlisting:\n\n- Complete the form on this page.\n- We’ll check out your application and assess it for a fit.\n- If shortlisted, you’ll hear from us within&nbsp;2-3 days.\n2) Interview Process: Typically, we do&nbsp;2-3 rou res, API design, data streaming, and database optimization.\n\nThe candidate should be capable of owning solutions end-to-end, from architecture and design through development, deployment, monitoring, and production support.\n\nKey Responsibilities\n\n\n\n- Design, develop, and maintain scalable, secure, and high-performing full-stack applications.\n- Build and manage serverless applications using AWS services and best practices.\n- Develop and maintain RESTful and GraphQL APIs.\n- Design and implement event-driven architectures and data streaming solutions using Apache Kafka.\n- Develop reusable frontend components and integrate them with backend services.\n- Design, optimize, and maintain relational and NoSQL databases.\n- Implement ETL and data transformation pipelines for large-scale systems.\n- Participate in end-to-end system design, including scalability, reliability, performance, and security considerations.\n- Monitor application health, troubleshoot production issues, and improve system observability.\n- Collaborate with product managers, architects, QA teams, and other stakeholders to deliver robust solutions.\n- Follow coding standards, perform code reviews, and ensure high-quality software delivery.\n- Contribute to CI/CD automation and deployment strategies.\n\nRequired Skills &amp; Qualifications\n\nBackend Development\n\n\n\n- Strong proficiency in TypeScript and Node.js.\n- Hands-on experience developing scalable backend services.\n- Strong understanding of asynchronous programming and modern architectural patterns.\n- Experience building microservices-based applications.\n\nCloud &amp; AWS Services\n\nHands-on Experience With\n\n\n\n- AWS Lambda\n- API Gateway\n- Amazon S3\n- Amazon SQS\n- Amazon SNS\n- Amazon MSK (Managed Kafka)\n- Amazon CloudWatch\n- AWS Secrets Manager\n\nServerless Architecture\n\n\n\n- Proven experience building and deploying Serverless applications.\n- Familiarity with Serverless Framework, AWS SAM, or equivalent tools.\n- Strong understanding of cloud-native application design principles.\n\nData &amp; Streaming\n\n\n\n- Strong experience with Apache Kafka and distributed messaging systems.\n- Understanding of event-driven architecture and real-time data processing.\n- Experience with ETL pipelines and stream processing concepts.\n- Knowledge of data transformation and integration patterns.\n\nDatabase Technologies\n\nExperience With\n\n\n\n- MySQL\n- MongoDB\n\nStrong Understanding Of\n\n\n\n- Database design and data modeling\n- Query optimization\n- Indexing strategies\n- Performance tuning\n- Data integrity and scalability\n\nAPI Development\n\nExpertise In\n\n\n\n- RESTful API design principles\n- GraphQL development\n- API versioning and documentation\n- API security using OAuth2, JWT, and authentication best practices\n- API performance optimization\n\nSystem Design &amp; Architecture\n\n\n\n- Ability to design large-scale distributed systems.\n- Deep understanding of:\n\n- Microservices Architecture\n- Distributed Systems\n- High Availability\n- Fault Tolerance\n- Resiliency Patterns\n- Scalability and Performance Optimization\n- Experience conducting architecture reviews and design discussions.\nFrontend Development\n\n\n\n- Experience with modern JavaScript/TypeScript frameworks such as React, Angular, or Vue.js.\n- Strong understanding of responsive UI development.\n- Experience integrating frontend applications with REST/GraphQL APIs.\n- Knowledge of state management, component-based architecture, and frontend performance optimization.\n\nPreferred Qualifications\n\n\n\n- Experience with CI/CD pipelines and DevOps practices.\n- Familiarity with Docker and Kubernetes.\n- Knowledge of monitoring, logging, and observability best practices.\n- Experience working on high-traffic or real-time applications.\n- Exposure to Agile/Scrum methodologies.\n- Experience with Infrastructure as Code (IaC) tools such as Terraform or AWS CloudFormation is an added advantage.\n\nEducational Qualification\n\nMinimum Qualification Required\n\n\n\n- B.Tech / B.E. / M.Sc. in Software Engineering, Computer Science, Information Technology, or a closely related discipline.","postedAt":"2026-09-02","url":"https://in.linkedin.com/jobs/view/full-stack-developer-at-azuga-inc-4433670579?position=10&pageNum=0&refId=JF%2B1Ylg9CwcmKKgDgaVMFA%3D%3D&trackingId=wHpIA5t5aAyGQSCmwj9WSg%3D%3D","companySizeRaw":1094,"fitScore":65,"tier":"medium","matchedSkills":["react","node","mongodb","mysql","typescript","javascript","java","restful","docker","ci/cd","nosql"],"missing":["3+ yrs required"]}],"stretch":[{"source":"LinkedIn","title":"Software Product & Platform Engineer","company":"Accenture in India","location":"Bengaluru, Karnataka, India","description":"Job Title - Software Prod &amp; Plat Engineer\n\nManagement Level: 09\n\nLocation: Bengaluru / Gurugram\n\nMust have skills: Backend Development (Java / Golang / Node.js / C#), Docker, AWS, Relational Databases (PostgreSQL / MySQL), Unit &amp; Integration Testing, hands-on experience with AI coding tools (Cursor / Claude), strong Computer Science fundamentals\n\nGood to have skills: Kubernetes, Frontend Development (React / Angular / HTML), building custom AI skills / tools\n\nExperience: Minimum 5 year(s) of experience is required\n\nEducational Qualification: B.Tech / BE from a Tier-1 institute (IIT / NIT / BITS / IIIT or equivalent top-tier college)\n\nJob Summary:\n\nWe don't want you typing - we want you thinking; let AI be your typist. As a Software Prod &amp; Plat Engineer at Accenture LearnVantage (ALV), you'll be a hands-on, AI-native engineer who builds and owns components, uses AI agents to move fast, and applies rigorous and responsible judgment to the code you ship. With strong CS fundamentals, you pick up new languages and stacks quickly and aren't afraid of unfamiliar territory.\n\nRoles &amp; Responsibilities:\n\nBuild and own backend components and features, hands-on in code, with growing independence.\n\n  the bar as we drive the next decade of growth. We’re on a mission to hire the very best and believe in creating a company culture where all employees are empowered to make an impact. At Adobe, we believe that great ideas can come from anywhere in the organization. The next big idea could be yours.\n\nLet’s Adobe together\n\nAt Adobe, we believe in creating a company culture where all employees are empowered to make an impact. Learn more about Adobe life, including our values and culture, focus on people, purpose and community, Adobe for All, comprehensive benefits programs, the stories we tell, the customers we serve, and how you can help us advance our mission of empowering everyone to create.\n\nAdobe is proud to be an Equal Employment Opportunity employer. We do not discriminate based on gender, race or color, ethnicity or national origin, age, disability, religion, sexual orientation, gender identity or expression, veteran status, or any other protected characteristic. Learn more.\n\nAdobe aims to make our Careers website and recruiting process accessible to any and all users. If you have a disability or special need that requires accommodation to navigate our website or complete the application process, email accommodations@adobe.com.\n\nAI Use Guidelines for Interviews:\n\nOur interviews are designed to reflect your own skills and thinking. The use of AI or recording tools during live interviews is not permitted unless explicitly invited by the interviewer or approved in advance as part of a reasonable accommodation. If these tools are used inappropriately or in a way that misrepresents your work, your application may not move forward in the process.\n\nAt Adobe, we empower employees to innovate with AI — and we look for candidates eager to do the same. As part of the hiring experience, we provide clear guidance on where AI is encouraged during the process and where it’s restricted during live interviews. See how we think about AI in the hiring experience."," eers do in five at a large company.\n\nWhat you will do\n\n- Develop and maintain the app in React Native across Android and iOS, with React.js for web surfaces where needed.\n- Build responsive, reusable UI components that hold up on low-end devices.\n- Integrate REST APIs, Firebase, and third-party services; handle state management, authentication, push notifications, and deep linking.\n- Monitor crashes through Firebase Crashlytics, debug from the trace, and optimize for performance and stability.\n- Manage Android and iOS builds end to end: signing, certificates, provisioning profiles, and release configurations using Android Studio, Xcode, Gradle, and CocoaPods.\n- Deploy to the Google Play Store and Apple App Store and own app launches and releases.\n- Work directly with product, design, backend, and QA; follow Git workflows and participate in code reviews.\n\nMust have\n\n- 1+ years of hands-on production experience with React Native or React.js.\n- Strong JavaScript or TypeScript.\n- Experience integrating REST APIs and Firebase, including Crashlytics.\n- Hands-on experience generating and deploying Android and iOS builds.\n- Strong debugging and problem-solving skills, and a solid grasp of Git workflows.\n- Proof of work. Something you shipped that we can see: a live app, a GitHub repo, or a TestFlight build.\n\nGood to have\n\n- Next.js experience.\n- CI/CD and automated build pipelines.\n- App Store and Play Store release management.\n- Native module integration (Kotlin/Java for Android, Swift/Objective-C for iOS) for when JavaScript is not enough.\n\nHow to apply\nMail bharatg@onmeta.in with proof of what you have shipped. A live app, a GitHub repo, a TestFlight build. Anything real beats a resume. Subject line: your name plus the best thing you have shipped.\n\n\nAbout OnMeta\nOnMeta is registered with the Financial Intelligence Unit (FIU-IND), Ministry of Finance, Government of India. Our infrastructure powers buy and sell experiences for more than 80 web3 platforms, with UPI settlements in under 60 seconds and KYC that completes in under two minutes.\nThat is the plumbing. What you will build is the consumer product on top of it: a new savings app for Indian users, from the same team, on rails that already move real money every day. You get zero-to-one ownership with regulated, production infrastructure underneath.\n\n","postedAt":"2026-08-30","url":"https://in.linkedin.com/jobs/view/software-development-engineer-i-at-onmeta-4459481003?position=7&pageNum=0&refId=IfTSTIVm5XFWLjDNJSZgUw%3D%3D&trackingId=ldHCR22Rpo1jMF6A80PyEQ%3D%3D","companySizeRaw":23,"fitScore":55,"tier":"stretch","matchedSkills":["react","typescript","javascript","java","rest api","ci/cd","next.js"],"missing":[]},{"source":"LinkedIn","title":"Associate-Digital Transformation","company":"Tesco Business Solutions","location":"Bengaluru, Karnataka, India","description":"About the role\nDesign, develop, and deliver high-quality web applications with a strong focus on reliability, scalability, performance, and zero-defect delivery. Contribute toward end-to-end development across front-end, back-end, and database layers, adhering to established engineering standards and best practices.&nbsp;Develop, maintain, and support web applications, APIs, and database solutions in alignment with Tesco's technical standards, security&nbsp;\nYou will be responsible for\nFollowing our Business Code of Conduct and always acting with integrity and due diligence and have these specific risk responsibilities:&nbsp;\nDesign, develop, test, and deploy scalable, secure, and high-performing web applications and APIs.• Deliver end-to-end application features across front-end, back-end, integrations, and database components.• Develop high-quality, reusable, and well-documented code while ensuring compliance with security and governance requirements.• Ensure solution quality through testing, code reviews, defect prevention, and adherence to defined quality standards.• Suppor tainable.&nbsp;\n&nbsp;\nSalary - Your fixed pay is the guaranteed pay as per your contract of employment.&nbsp;\n&nbsp;\nPerformance Bonus - Opportunity to earn additional compensation bonus based on performance, paid annually&nbsp;\n&nbsp;\nLeave &amp; Time-off - Colleagues are entitled to 30 days of leave (18 days of Earned Leave, 12 days of Casual/Sick Leave) and 10 national and festival holidays, as per the company&rsquo;s policy.&nbsp;\n&nbsp;\nMaking Retirement Tension-FreeSalary - In addition to Statutory retirement beneets, Tesco enables colleagues to participate in voluntary programmes like NPS and VPF.&nbsp;\n&nbsp;\nHealth is Wealth - Tesco promotes programmes that support a culture of health and wellness including insurance for colleagues and their family. Our medical insurance provides coverage for dependents including parents or in-laws.&nbsp;\n&nbsp;\nMental Wellbeing - We offer mental health support through self-help tools, community groups, ally networks, face-to-face counselling, and more for both colleagues and dependents.&nbsp;&nbsp;\n&nbsp;\nFinancial Wellbeing - Through our financial literacy partner, we offer one-to-one financial coaching at discounted rates, as well as salary advances on earned wages upon request.&nbsp;&nbsp;\n&nbsp;\nSave As You Earn (SAYE) - Our SAYE programme allows colleagues to transition from being employees to Tesco shareholders through a structured 3-year savings plan.&nbsp;&nbsp;\n&nbsp;\nPhysical Wellbeing - Our green campus promotes physical wellbeing with facilities that include a cricket pitch, football field, badminton and volleyball courts, along with indoor games, encouraging a healthier lifestyle.&nbsp;\nAbout Us\nAt Tesco, inclusion is at the heart of everything we do. We believe in treating everyone fairly and with respect, valuing individuality and uniqueness to create a true sense of belonging. Diversity and inclusion are deeply embedded in our values—we treat people how they want to be treated. Our goal
