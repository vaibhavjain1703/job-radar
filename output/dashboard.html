nce, and mobility resources designed for global aspirants. Transparency, precision, and client trust are the foundation of everything we build.\n\nRole Overview\n\nWe are looking for an AI Engineer to build products that use large language models to help people plan their move abroad. You will work with our product and tech teams to take an idea from a rough sketch to a working feature that real users rely on. Freshers with good projects and a strong interest in AI are welcome to apply.\n\nKey Responsibilities\n\n\n\n- Build AI features using LLM APIs, such as chat assistants, document readers and smart search.\n- Set up RAG systems so our AI answers from TerraTern’s own trusted information.\n- Create AI agents and workflows that handle repeat tasks for our users and our team.\n- Connect AI features to our website, apps and internal tools through clean APIs.\n- Test every feature on real questions, and fix wrong or unclear answers before users see them.\n- Watch speed, cost and accuracy after launch, and bring all three in line.\n- Work with product managers and designers so each feature is easy to use and solves a real problem.\n\nEligibility &amp; Requirements\n\n\n\n- 1 to 3 years of experience building software or AI applications, or a fresher with strong projects, internships or open-source work.\n- Bachelor’s or Master’s degree in Computer Science, Engineering, AI or a related field.\n- Good Python skills, and comfort with APIs, Git and a database.\n- Hands-on use of at least one LLM API such as OpenAI, Claude or Gemini.\n- Basic understanding of embeddings, vector search and prompt design.\n- Clear communication, and the ability to explain technical ideas in simple words.\n- Curiosity, ownership and a habit of finishing what you start.\n\nNice to Have\n\n\n\n- Experience with LangChain, LlamaIndex, n8n or similar tools.\n- A deployed AI project, even a small personal one.\n- Interest in immigration, education or global careers.\n\nWhy Join TerraTern\n\n\n\n- n- Hands-on experience building or operating WebRTC/video conferencing systems, including\n- WebRTC providers or platforms at meaningful scale.\n- Strong understanding of WebRTC and real-time media: simulcast, adaptive bitrate, codecs,\n- RTP/RTCP, ICE, STUN/TURN, and related concepts.\n- Strong debugging and root-cause analysis skills.\n- Experience with production telemetry, monitoring, and observability.\n- Ability to analyze browser waterfalls and network behavior.\n- Experience with distributed systems and production infrastructure.\n- Strong understanding of AI development tools and workflows.\n\n\nStrong Plus\n\n\n\n- Experience building agentic platforms or AI-powered products.\n- Experience with large-scale conferencing platforms or thousands of concurrent real-time\n- connections.\n- Experience with Amazon IVS, LiveKit, Agora, Twilio, Daily, Vonage, or similar platforms.\n- Experience with OpenTelemetry or similar observability tooling.\n- Experience building real-time dashboards and monitoring systems.\n- Experience with media quality analytics and WebRTC QoS.\n- Experience with Kubernetes and AWS.\n\n\nWhat You'll Do\n1. Work on agentic and AI platforms\n\n\n\n- Build applications where AI agents interact with users, tools, APIs, and business systems.\n- Understand agent workflows, tool calling, state management, and orchestration.\n- Build reliable systems around LLMs and agents, with attention to latency, reliability,\n- observability, and cost.\n- Evaluate and monitor AI-powered workflows.\n- Use AI aggressively as a development multiplier. You should ask \"Can AI do this for me?\" before\n- spending hours on repetitive work by hand.\n\n\n2. Full-stack engineering\n\n\n\n- Frontend: Build with React.js and Next.js, with a solid grasp of browser performance, state\n- management, API integration, and modern web architecture. Debug issues at the frontend,\n- browser, and network levels.\n- Backend: Design and build APIs and backend services in Node.js. Work with asynchronous and\n- distributed systems, MySQL and database design, caching, queues, and event-driven\n- architecture.\n- Infrastructure: Understand cloud infrastructure, containers, deployment, scaling, and\n- observability, and debug across application, infrastructure, and network layers.","postedAt":"2026-11-16","url":"https://in.linkedin.com/jobs/view/senior-full-stack-engineer-at-brightchamps-4490273295?position=14&pageNum=0&refId=NiRXqCvfYJqpATbctNGB0A%3D%3D&trackingId=sYKtxWgrdZ5tbPWHtVhRag%3D%3D","companySizeRaw":1571,"fitScore":61,"tier":"stretch","matchedSkills":["react","node","mysql","next.js","llm","ai-powered"],"missing":[]},{"source":"LinkedIn","title":"Sr Software Engineer (Full Stack – React / Node.js / Java)","company":"PayPal","location":"Bengaluru, Karnataka, India","description":"The Company\nPayPal has been revolutionizing commerce globally for more than 25 years. Creating innovative experiences that make moving money, selling, and shopping simple, personalized, and secure, PayPal empowers consumers and businesses in approximately 200 markets to join and thrive in the global economy.\n\nWe operate a global, two-sided network at scale that connects hundreds of millions of merchants and consumers. We help merchants and consumers connect, transact, and complete payments, whether they are online or in person. PayPal is more than a connection to third-party payment networks. We provide proprietary payment solutions accepted by merchants that enable the completion of payments on our platform on behalf of our customers.\n\nWe offer our customers the flexibility to use their accounts to purchase and receive payments for goods and services, as well as the ability to transfer and withdraw funds. We enable consumers to exchange funds more safely with merchants using a variety of funding sources, which may include a bank account, a PayPal or Venmo account balance, PayPal and Venmo branded credit products, a credit card, a debit card, certain cryptocurrencies, or other stored value products such as gift cards, and eligible credit card rewards. Our PayPal, Venmo, and Xoom products also make it safer and simpler for friends and family to transfer funds to each other. We offer merchants an end-to-end payments solution that provides authorization and settlement capabilities, as well as instant access to funds and payouts. We also help merchants connect with their customers, process exchanges and returns, and manage risk. We enable consumers to engage in cross-border shopping and merchants to extend their global reach while reducing the complexity and friction involved in enabling cross-border trade.\n\nOur beliefs are the foundation for how we conduct business every day. We live each day guided by our core values of Inclusion, Innovation, Collaboration, and Wellness. Together, our values ensure that we work together as one global team with our customers at the center of everything we do – and they push us to ensure we take care of ourselves, each other, and our communities.\n\nJob Summary:\n\nSummary\nThe role is for an experienced software engineer building a futuristic Risk platform and experiences for PayPal's diverse customer base across the globe. You will work with business teams, product teams, architects, and engineers in our global offices. We are looking for a true Full Stack Developer who has built high-performing, scalable, enterprise-grade applications and is comfortable owning everything from the user interface to the services and data behind it (React, Node.js, Java/J2EE, and Spring Boot).\n\nMeet Our Team\n\nYou'll work alongside the best and brightest engineering talent in the industry. We have opportunities in development, design, search, platform, test, quality, big data, front end, and back end. As a core participant on the team, you'll estimate engineering efforts, design your changes, implement and test them, push to live, and triage production issues.\n\nJob Description:\n\nEssential Responsibilities: \n\n\n\n- Delivers complete solutions spanning all phases of the Software Development Lifecycle (SDLC) (design, implementation, testing, delivery and operations), based on definitions from more senior roles.\n- Advises immediate management on project-level issues\n- Guides junior engineers\n- Operates with little day-to-day supervision, making technical decisions based on knowledge of internal conventions and industry best practices\n- Applies knowledge of technical best practices in making decisions\n\nMinimum Qualifications:\n\n\n\n- 3+ years relevant experience and a Bachelor’s degree OR Any equivalent combination of education and experience.\n\nAdditional Responsibilities &amp; Preferred Qualifications:\n\nEssential Responsibilities\n\n\n- Deliver complete solutions across all phases of the SDLC (design, implementation, testing, delivery, and operations), based on definitions from more senior roles.\n- Design and build scalable, secure back-end services and REST/GraphQL APIs using Java/J2EE, Spring Boot, and Node.js.\n- Build responsive, accessible, high-performance React user interfaces and reusable component libraries.\n- Take end-to-end ownership of features across the full stack, from UI to API to data.\n- Advise immediate management on project-level issues.\n- Guide junior engineers.\n- Operate with little day-to-day supervision, making technical decisions based on internal conventions and industry best practices.\n\nExpected Qualifications\n\n\n- 3+ years of relevant experience and a Bachelor's degree, or an equivalent combination of education and experience.\n- Hands-on full-stack experience with React, Node.js, and Java/J2EE/Spring Boot.\n- Solid knowledge of JavaScript/TypeScript, HTML/CSS, REST APIs, microservices, and automated testing.\n\nPreferred Qualifications\n\n\n- Experience building full-stack (Node.js/React) or Spring Boot-based applications, with a strong desire to build SDKs and developer tools.\n- Experience with developer-facing products (SDKs, REST APIs, GraphQL) or products that enable third-party development. Great to have, not required.\n- Experience with relational and NoSQL databases, messaging/event streaming (e.g., Kafka), and cloud-native deployment.\n- Familiarity with state management, performance optimization, and CI/CD for web and Java applications.\n- Excitement about our team's focus on open source (we are fully open source) and on improving developer experience.\n- Awareness of industry trends and technologies, applied to our products and for our merchants.\n\nWhat You'll Be Doing\n\n\n- Building back-end Java/Spring Boot and Node.js services and APIs that power Risk and Device Intelligence capabilities.\n- Building React front-end applications, dashboards, and developer portals, and JavaScript SDK features that expose APIs in a delightful way.\n- Partnering closely with cross-functional teams, such as Venmo and PayPal, on design and product.\n- Providing feedback on code and contributing to architecture discussions.\n- Engaging with internal and external developers to understand their pain points and improve the developer experience.\n\nHow We Work\n\n\n- Communication is key, and we don't let walls hinder it. We work directly with other teams and strive for clear communication.\n- Engineers build, test, release, and monitor their own code.\n- We pair program when we're stuck, because we do our best work together.\n- We default to async communication and call meetings only when necessary.\n- We hold daily stand-ups and regular retrospectives to discuss what's going well and where we can improve.\n- We value unique perspectives from diverse backgrounds and experiences. A broad range of ideas helps us create the best product and work environment.\n\nSubsidiary:\n\nPayPal\n\nTravel Percent:\n\n0\n\nPayPal does not charge candidates any fees for courses, applications, resume reviews, interviews, background checks, or onboarding. When making an application directly, we will never ask you to share passwords, one-time passcodes (OTP), or verification codes. Any such request is a red flag and likely part of a scam. All communication regarding your application will come from official PayPal email domains. If you suspect fraudulent activity, please report it immediately. To learn more about how to identify and avoid recruitment fraud please visit https://careers.pypl.com/contact-us.\n\nFor the majority of employees, PayPal's balanced hybrid work model offers 3 days in the office for effective in-person collaboration and 2 days at your choice of either the PayPal office or your home workspace, ensuring that you equally have the benefits and conveniences of both locations.\n\nOur Benefits:\n\nAt PayPal, we’re committed to building an equitable and inclusive global economy. And we can’t do this without our most important asset-you. That’s why we offer comprehensive, choice-based programs, to support all aspects of personal wellbeing—physical, emotional, and financial—delivering meaningful value where it matters most. We strive to create a flexible, balanced work culture with a holistic approach to benefits, including generous paid time off, healthcare coverage for you and your family, and resources to create financial security and support your mental health.\n\nWho We Are:\n\nClick Here to learn more about our culture and community.\n\nCommitment to Diversity and Inclusion \n\nPayPal provides equal employment opportunity (EEO) to all persons regardless of age, color, national origin, citizenship status, physical or mental disability, race, religion, creed, gender, sex, pregnancy, sexual orientation, gender identity and/or expression, genetic information, marital status, status with regard to public assistance, veteran status, or any other characteristic protected by federal, state, or local law. In addition, PayPal will provide reasonable accommodations for qualified individuals with disabilities. If you are unable to submit an application because of incompatible assistive technology or a disability, please contact us at paypalglobaltalentacquisition@paypal.com.\n\nBelonging at PayPal:\n\nOur employees are central to advancing our mission, and we strive to create an environment where everyone can do their best work with a sense of purpose and belonging. Belonging at PayPal means creating a workplace with a sense of acceptance and security where all employees feel included and valued. We are proud to have a diverse workforce reflective of the merchants, consumers, and communities that we serve, and we continue to take tangible actions to cultivate inclusivity and belonging at PayPal.\n\nAny general requests for consideration of your skills, please Join our Talent Community.\n\nWe know the confidence gap and imposter syndrome can get in the way of meeting spectacular candidates. Please don’t hesitate to apply.","postedAt":"2026-11-12","url":"https://in.linkedin.com/jobs/view/sr-software-engineer-full-stack-%E2%80%93-react-node-js-java-at-paypal-4490322334?position=17&pageNum=0&refId=NiRXqCvfYJqpATbctNGB0A%3D%3D&trackingId=Y%2B3p8iLOIyjMu0l0dZPkSg%3D%3D","companySizeRaw":35642,"fitScore":53,"tier":"stretch","matchedSkills":["react","node","express","typescript","javascript","java","rest api","ci/cd","nosql"],"missing":["3+ yrs required"]},{"source":"LinkedIn","title":"Software Engineer I","company":"Rippling","location":"Bengaluru, Karnataka, India","description":"About Rippling\n\nRippling gives businesses one place to run HR, IT, and Finance. It brings together all of the workforce systems that are normally scattered across a company, like payroll, expenses, benefits, and computers. For the first time ever, you can manage and automate every part of the employee lifecycle in a single system.\n\nTake onboarding, for example. With Rippling, you can hire a new employee anywhere in the world and set up their payroll, corporate card, computer, benefits, and even third-party apps like Slack and Microsoft 365—all within 90 seconds.\n\nBased in San Francisco, CA, Rippling has raised $1.8B+ from the world’s top investors—including Kleiner Perkins, Founders Fund, Sequoia, Greenoaks, and Bedrock—and was named one of America's best startup employers by Forbes.\n\nWe prioritize candidate safety. Please be aware that all official communication will only be sent from @Rippling.com addresses.\n\nAbout The Role\n\nThe Finance Experience Team builds the foundation and platform for Rippling’s Finance Suite. Our mission is to make every Finance product feel like one coherent, intelligent suite—not a collection of separate tools. We own the common experiences, workflows, controls, data platforms, and AI-assisted capabilities used across Spend, Accounting, and related Finance products.\n\nWhat You Will Do\n\n\n\n- Build high-quality web and mobile experiences spanning Finance Overview, Tasks, People, Settings, notifications, and suite-wide navigation. \n- Develop shared application platforms and public APIs that enable Finance product teams to build consistent, scalable features quickly. \n- Engineer foundational data experiences, including configurable grids, advanced filtering and sorting, bulk actions, reconciliation workflows, and rich transaction line items. \n- Build secure, auditable controls such as permissions, policies, approvals, delegation, and rule-engine capabilities that work consistently across Finance products. \n- Collaborate closely with product, design, and engineering teams to simplify complex financial workflows into intuitive experiences for employees and finance administrators. \n- Contribute to AI-powered experiences that help customers understand their financial data, complete tasks, and operate more efficiently across the Finance Suite. \n\nWhat You Will Have\n\n\n\n- 1-2 years experience working with fast growing, top tier product companies\n- Strong coding in one or more programming languages such as Java, Python, C++, or Go. \n- Expert understanding of data structures, algorithms, software design principles and low level design\n- Ability to communicate clearly and work effectively in a collaborative environment\n- Understanding of system design and complex distributed systems\n- Eagerness to learn new technologies and apply them to solve real-world problems. \n- Bonus points for open source contributions, competitive coding experience, and a strong Computer Science background from a Tier 1 institution. \n\nAdditional Information\n\nRippling is an equal opportunity employer. We are committed to building a diverse and inclusive workforce and do not discriminate based on race, religion, color, national origin, ancestry, physical disability, mental disability, medical condition, genetic information, marital status, sex, gender, gender identity, gender expression, age, sexual orientation, veteran or military status, or any other legally protected characteristics, Rippling is committed to providing reasonable accommodations for candidates with disabilities who need assistance during the hiring process. To request a reasonable accommodation, please email accomodations@rippling.com\n\nRippling highly values having employees working in-office to foster a collaborative work environment and company culture. For office-based employees (employees who live within a defined radius of a Rippling office), Rippling considers working in the office, at least three days a week under current policy, to be an essential function of the employee's role.","postedAt":"2026-11-13","url":"https://in.linkedin.com/jobs/view/software-engineer-i-at-rippling-4490713187?position=8&pageNum=0&refId=zweCCQhREVNwr8R41ScC3A%3D%3D&trackingId=XoovR22k5x2ZrlKWN90lrg%3D%3D","companySizeRaw":7886,"fitScore":53,"tier":"stretch","matchedSkills":["express","java","data structures","algorithms","ai-powered","ai-assisted"],"missing":[]},{"source":"LinkedIn","title":"Full Stack Software Engineer - Postgres","company":"ClickHouse","location":"Bengaluru, Karnataka, India","description":"About ClickHouse\n\nRecognized on the 2025 Forbes Cloud 100 list, ClickHouse is one of the most innovative and fast-growing private cloud companies. With over 2,000 customers and ARR that has more than quadrupled over the past year, ClickHouse leads the market in real-time analytics, data warehousing, observability, and AI workloads. We're on a mission to transform how companies use data. Come be a part of our journey!\n\nAbout The Team\n\nThe Managed Postgres team is building ClickHouse's fully managed Postgres service. It gives developers a fast, reliable Postgres that works natively alongside ClickHouse, so one platform covers both transactional and real-time analytical workloads. This is a strategic, high-visibility initiative, and the user experience we build will shape how thousands of developers create, manage, monitor, and scale their databases.\n\nAbout The Role\n\nWe're looking for a Full Stack Software Engineer to help build responsive, performant, and elegant interfaces that make complex database operations feel simple. You'll work closely with product, design, and backend engineers, and you'll learn from senior engineers while owning real features from day one.\n\nWhat You'll Do\n\n\n\n- Turn designs and user requirements into intuitive, high-quality interfaces for the Managed Postgres experience in ClickHouse Cloud.\n- Build features end-to-end: React and TypeScript on the frontend, plus integration with (and contributions to) backend APIs.\n- Build data-rich UIs for metrics, diagnostics, backups, replication, and performance insights.\n- Contribute to click-ui, our open-source design system, and follow frontend best practices: code quality, performance, accessibility, and testing.\n- Give product and design feedback from a developer's point of view.\n\nAbout You\n\n\n\n- Experience: 1–4 years in frontend or full-stack development.\n- Core skills: Solid React, TypeScript, and modern frontend fundamentals (state management, component architecture, data fetching).\n- Backend exposure: Comfortable working with REST APIs; Node.js, Go, or similar is a plus.\n- Collaboration: You enjoy working closely with designers and backend engineers across a global team.\n- Developer empathy: You care about fast, clear, purposeful UIs for technical users.\n- Ownership: You take initiative, ask good questions, and carry work from idea to delivery.\n- Growth mindset: You're keen to learn and grow your scope quickly.\n\nNice to Have\n\n\n\n- Experience with Postgres, SQL, or database tooling\n- Accessibility (WCAG) knowledge\n- Data visualization or dashboard experience\n- Open-source contributions\n\nWhy Join Us\n\n\n\n- Shape the future of the Postgres user experience inside one of the fastest-growing data platforms.\n- Real ownership and autonomy from day one.\n- Learn from experts in databases, distributed systems, and developer experience.\n- Solve meaningful problems in performance, scale, and usability.\n\nPerks\n\n\n\n- Flexible work environment - ClickHouse is a globally distributed company and remote-friendly. We currently operate in over 25 countries.\n- Healthcare - Employer contributions towards your healthcare.\n- Equity in the company - Every new eligible team member who joins our company receives equity.\n- Time off - Flexible time off in the US, generous entitlement in other countries.\n- A USD$500 Home office setup if you’re a remote employee.\n- Global Gatherings – We believe in the power of in-person connection and offer opportunities to engage with colleagues at company-wide offsites.\n\nCulture - We All Shape It\n\nAs part of a rapidly scaling start-up, you will be instrumental in shaping our culture.\n\nAre you interested in finding out more about our culture? Learn more about our values here. Check out our blog posts or follow us on LinkedIn to find out more about what’s happening at ClickHouse.\n\nEqual Opportunity &amp; Privacy\n\nClickHouse provides equal employment opportunities to all employees and applicants and prohibits discrimination and harassment of any type based on factors such as race, color, religion, age, sex, national origin, disability status, genetics, protected veteran status, sexual orientation, gender identity or expression, or any other characteristic protected by federal, state or local laws.\n\nPlease see here for our Privacy Statement.\n\n","postedAt":"2026-11-10","url":"https://in.linkedin.com/jobs/view/full-stack-software-engineer-postgres-at-clickhouse-4487990919?position=5&pageNum=0&refId=5zopqkdUy0rfc6FDRTT%2BMw%3D%3D&trackingId=O4ndpPwcKIkH%2FFxW7Ctraw%3D%3D","companySizeRaw":756,"fitScore":52,"tier":"stretch","matchedSkills":["react","node","express","typescript","rest api"],"missing":[]},{"source":"LinkedIn","title":"Senior Software Engineer (React + Node)","company":"Tricog Health","location":"Bengaluru, Karnataka, India","description":"\nAbout Tricog\nTricog is a healthcare technology, product-based company headquartered in Bangalore. We build predictive and virtual diagnostic solutions for cardiovascular diseases, enabling clinicians to make faster, more accurate decisions that save lives.\nOur software directly supports clinical decision-making. As a result, we place a strong emphasis on correctness, reliability, security, and data privacy.\n\n\nRole Overview\nWe are looking for a Senior Full Stack Engineer with strong frontend expertise who can independently design, build, and deliver high-quality features across the stack. You will play a key role in shaping implementation decisions, improving engineering standards, and mentoring junior engineers.\nThis role is ideal for engineers who enjoy owning problems end-to-end and working closely with product, clinical, and engineering stakeholders.\n\n\nKey Responsibilities\n● Design, develop, and maintain end-to-end features across frontend and backend systems\n● Build scalable, maintainable frontend applications using React.js\n● Design and implement robust backend service \n● Influence technical decisions and engineering practices\n● Work on systems where correctness truly matters\n● Grow toward Staff/Lead roles with increasing scope and impact","postedAt":"2026-11-12","url":"https://in.linkedin.com/jobs/view/senior-software-engineer-react-%2B-node-at-tricog-health-4488293841?position=7&pageNum=0&refId=NiRXqCvfYJqpATbctNGB0A%3D%3D&trackingId=qxTFgj%2B%2B6Jo358xJLY0r5g%3D%3D","companySizeRaw":372,"fitScore":51,"tier":"stretch","matchedSkills":["react","node","mysql","typescript","javascript","java","restful","docker","ci/cd","ai-assisted"],"missing":["4+ yrs required"]}]};
  const listEl = document.getElementById('list');
  function render(tier) {
    const jobs = tiers[tier] || [];
    listEl.innerHTML = jobs.length
      ? jobs.map(j => `
        <div class="card" data-tier="${j.tier}">
          <div class="card-top">
            <div>
              <p class="card-title">${j.title}</p>
              <p class="card-sub"><b>${j.company}</b> · ${j.location || "Location n/a"} · ${j.source}</p>
            </div>
            <div class="score"><div class="num">${j.fitScore}</div><div class="lbl">fit score</div></div>
          </div>
          <div class="tags">${(j.matchedSkills||[]).slice(0,6).map(t=>'<span class="tag">'+t+'</span>').join('')}${(j.missing||[]).map(t=>'<span class="tag miss">'+t+'</span>').join('')}</div>
          <div class="card-foot">
            <span class="posted">${j.postedAt ? new Date(j.postedAt).toLocaleDateString() : "Date n/a"}</span>
            <a class="apply" href="${j.url}" target="_blank" rel="noopener">View / Apply →</a>
          </div>
        </div>`).join('')
      : '<div class="empty">No roles in this tier right now.</div>';
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    render(t.dataset.tier);
  }));
  render('high');

  // Check-in streak, stored in this browser's localStorage (real page, not a sandboxed artifact)
  (function(){
    const today = new Date().toISOString().slice(0,10);
    const raw = localStorage.getItem('jobradar_streak');
    let state = raw ? JSON.parse(raw) : { streak: 0, last: null };
    if (state.last !== today) {
      const gapDays = state.last ? Math.round((new Date(today) - new Date(state.last)) / 86400000) : null;
      state.streak = gapDays === 1 ? state.streak + 1 : 1;
      state.last = today;
      localStorage.setItem('jobradar_streak', JSON.stringify(state));
    }
    document.getElementById('streakbar').innerHTML =
      '🔥 ' + state.streak + '-day check-in streak · Last refreshed by the daily job: ' + new Date("2026-11-16T10:04:01.438Z").toLocaleString();
  })();
</script>
